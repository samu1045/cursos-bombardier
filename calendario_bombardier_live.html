<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Training Schedule — Bombardier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07090F;--ink2:#0C1220;--ink3:#141927;
  --card:#111827;--card2:#161E2E;
  --gold:#C9A84C;--gold2:#E2C06A;--gold3:#F0D080;
  --white:#FFF;
  --mist:rgba(255,255,255,0.05);--mist2:rgba(255,255,255,0.09);
  --line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.13);
  --text:rgba(255,255,255,0.90);--text2:rgba(255,255,255,0.52);--text3:rgba(255,255,255,0.28);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:10px;--r2:16px;--nh:58px;--bnh:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--ink);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* ── COVER ── */
#cover{position:fixed;inset:0;z-index:500;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;transition:opacity .7s ease,transform .7s ease;}
#cover.hide{opacity:0;transform:translateY(-30px);pointer-events:none;}
.cvbg{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.cvbg::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.09) 0%,transparent 70%);top:-150px;right:-150px;animation:bgp 8s ease-in-out infinite alternate;}
.cvbg::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.07) 0%,transparent 70%);bottom:-120px;left:-120px;animation:bgp 10s ease-in-out infinite alternate-reverse;}
@keyframes bgp{from{transform:scale(1);}to{transform:scale(1.18);}}
.cvgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 80%);}
.corner{position:absolute;width:50px;height:50px;border-color:rgba(201,168,76,.18);border-style:solid;pointer-events:none;}
.ctl{top:20px;left:20px;border-width:1px 0 0 1px;}
.ctr{top:20px;right:20px;border-width:1px 1px 0 0;}
.cbl{bottom:20px;left:20px;border-width:0 0 1px 1px;}
.cbr{bottom:20px;right:20px;border-width:0 1px 1px 0;}
.cvsymbol{position:relative;z-index:1;margin-bottom:2rem;opacity:0;transform:scale(.7);animation:symIn .9s cubic-bezier(.16,1,.3,1) .2s forwards;}
@keyframes symIn{to{opacity:1;transform:scale(1);}}
.cvbrand{position:relative;z-index:1;text-align:center;opacity:0;transform:translateY(20px);animation:fUp .8s cubic-bezier(.16,1,.3,1) .5s forwards;}
@keyframes fUp{to{opacity:1;transform:translateY(0);}}
.cvname{font-family:var(--serif);font-size:clamp(32px,8vw,52px);font-weight:300;color:var(--white);letter-spacing:.18em;text-transform:uppercase;line-height:1;}
.cvrule{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;opacity:0;animation:fIn .6s ease .9s forwards;}
@keyframes fIn{to{opacity:1;}}
.cvsub{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);opacity:0;animation:fIn .6s ease 1s forwards;}
.cvyear{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.12em;margin-top:6px;opacity:0;animation:fIn .6s ease 1.1s forwards;}
.cvstats{position:relative;z-index:1;display:flex;gap:2rem;margin-top:2.5rem;opacity:0;transform:translateY(12px);animation:fUp .7s cubic-bezier(.16,1,.3,1) 1.2s forwards;}
.cst{text-align:center;}
.cstn{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--white);line-height:1;}
.cstl{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.cstd{width:1px;background:var(--line2);align-self:stretch;margin:4px 0;}
.cvcta{position:relative;z-index:1;margin-top:3rem;opacity:0;transform:translateY(12px);animation:fUp .7s cubic-bezier(.16,1,.3,1) 1.5s forwards;}
.btnenter{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid rgba(201,168,76,.45);color:var(--gold2);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:14px 32px;border-radius:var(--r);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,transform .15s;position:relative;overflow:hidden;}
.btnenter::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.12),transparent);opacity:0;transition:opacity .25s;}
.btnenter:hover::before,.btnenter:active::before{opacity:1;}
.btnenter:hover{border-color:rgba(201,168,76,.7);transform:translateY(-1px);}
.btnenter:active{transform:translateY(0);}
.btnarr{font-size:14px;transition:transform .2s;}
.btnenter:hover .btnarr{transform:translateX(3px);}

/* loading state en cover */
.cv-loading{position:relative;z-index:1;margin-top:1rem;font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:.08em;opacity:0;animation:fIn .4s ease 1.6s forwards;}
.cv-err{position:relative;z-index:1;margin-top:.75rem;font-size:11px;color:#FCA5A5;font-family:var(--mono);text-align:center;display:none;}

/* ── APP ── */
#app{opacity:0;visibility:hidden;transition:opacity .6s ease .1s;}
#app.show{opacity:1;visibility:visible;}
.hdr{position:fixed;top:0;left:0;right:0;height:var(--nh);background:rgba(7,9,15,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 1.1rem;z-index:300;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-brand{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--white);letter-spacing:.12em;text-transform:uppercase;line-height:1;}
.logo-div{font-size:9px;font-weight:600;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-top:3px;}
.hdr-date{font-family:var(--mono);font-size:10px;color:var(--text3);}

/* live indicator */
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.22);border-radius:20px;padding:3px 9px;font-size:9px;font-weight:600;color:#6EE7B7;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);}
.live-dot{width:5px;height:5px;border-radius:50%;background:#10B981;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.wrap{padding-top:calc(var(--nh) + 1rem);padding-bottom:calc(var(--bnh) + 1.5rem);max-width:840px;margin:0 auto;padding-left:.9rem;padding-right:.9rem;}
.sect{opacity:0;transform:translateY(24px);transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1);}
.sect.in{opacity:1;transform:translateY(0);}

/* HERO */
.hero{border-radius:var(--r2);overflow:hidden;margin-bottom:1.1rem;position:relative;border:1px solid var(--line);}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 85% -5%,rgba(201,168,76,.12) 0%,transparent 60%),radial-gradient(ellipse 55% 70% at -5% 55%,rgba(37,99,235,.08) 0%,transparent 60%),linear-gradient(155deg,#0D1220 0%,#07090F 100%);pointer-events:none;}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:38px 38px;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);}
.hero-inner{padding:1.3rem 1.1rem 1.1rem;position:relative;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.3rem;gap:10px;flex-wrap:wrap;}
.hero-eyebrow{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.hero-title{font-family:var(--serif);font-size:26px;font-weight:300;color:var(--white);line-height:1.1;}
.hero-title em{color:var(--gold2);font-style:italic;}
.hero-pill{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.28);color:var(--gold2);font-size:10px;font-weight:500;padding:5px 11px;border-radius:20px;white-space:nowrap;font-family:var(--mono);flex-shrink:0;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:1.1rem;}
.kpi{background:var(--mist);border:1px solid var(--line);border-radius:var(--r);padding:11px 8px;text-align:center;}
.kpi-n{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--white);line-height:1;}
.kpi-l{font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.mrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-ms-overflow-style:none;scrollbar-width:none;}
.mrow::-webkit-scrollbar{display:none;}
.mc{flex-shrink:0;min-width:76px;background:var(--mist);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:background .18s,border-color .18s;}
.mc.on{background:rgba(201,168,76,.13);border-color:rgba(201,168,76,.36);}
.mc.on .mc-n{color:var(--gold2);}
.mc-l{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);font-weight:600;}
.mc-n{font-family:var(--serif);font-size:20px;color:var(--text);line-height:1.15;margin-top:1px;}
.mc-s{font-size:9px;color:var(--text3);margin-top:1px;font-family:var(--mono);}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.32) 30%,rgba(201,168,76,.32) 70%,transparent);margin:.2rem 0 1.1rem;}

/* última actualización */
.last-upd{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:right;margin-bottom:.6rem;letter-spacing:.04em;}

/* PANEL */
.panel{background:var(--card);border-radius:var(--r2);border:1px solid var(--line);overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--ink2);overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tbtn{flex:1;min-width:88px;padding:13px 8px;border:none;background:transparent;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .18s,border-color .18s;position:relative;bottom:-1px;letter-spacing:.04em;-webkit-tap-highlight-color:transparent;}
.tbtn:hover{color:var(--text2);}
.tbtn.on{color:var(--gold2);border-bottom-color:var(--gold);}
.sbar{padding:11px 14px;border-bottom:1px solid var(--line);background:var(--ink2);}
.sinner{position:relative;}
.sico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}
.sbar input{width:100%;padding:9px 12px 9px 33px;border-radius:var(--r);border:1px solid var(--line2);background:var(--mist);color:var(--text);font-size:13px;font-family:var(--sans);-webkit-appearance:none;}
.sbar input:focus{outline:none;border-color:rgba(201,168,76,.38);}
.sbar input::placeholder{color:var(--text3);}
.vbody{padding:10px 10px 14px;}
.eyebrow{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);margin:2px 2px 10px;}
.gc{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:7px;overflow:hidden;background:var(--card);}
.gh{padding:12px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.gh:active{background:var(--mist);}
.gav{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.gi{flex:1;min-width:0;}
.gn{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gs{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono);}
.gm{font-size:10px;color:var(--text3);white-space:nowrap;font-family:var(--mono);}
.chv{font-size:10px;color:var(--text3);transition:transform .22s;flex-shrink:0;}
.chv.o{transform:rotate(90deg);}
.gb{display:none;border-top:1px solid var(--line);}
.gb.o{display:block;}
.sb{border-bottom:1px solid var(--line);}
.sb:last-child{border-bottom:none;}
.shd{padding:9px 13px 9px 18px;display:flex;align-items:center;gap:9px;cursor:pointer;background:var(--ink2);-webkit-tap-highlight-color:transparent;}
.shd:active{background:var(--ink3);}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sn{font-size:13px;font-weight:500;color:var(--text);flex:1;}
.sm{font-size:10px;color:var(--text3);font-family:var(--mono);}
.sc{font-size:9px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.sc.o{transform:rotate(90deg);}
.sbdy{display:none;}
.sbdy.o{display:block;}
.ibar{padding:7px 13px 7px 38px;display:flex;flex-wrap:wrap;gap:5px;background:var(--ink2);border-bottom:1px solid var(--line);}
.ar{padding:9px 13px 9px 38px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);}
.aav{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.an{font-size:12px;color:var(--text2);flex:1;}
.ach{display:flex;flex-wrap:wrap;gap:3px;}
.cr{padding:11px 13px 11px 54px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border-bottom:1px solid var(--line);}
.cr:last-child{border-bottom:none;}
.cn{font-size:13px;font-weight:500;color:var(--text);margin-bottom:5px;}
.cc{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px;}
.cd{font-size:10px;color:var(--text2);font-family:var(--mono);white-space:nowrap;text-align:right;}
.badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--text2);background:var(--mist);border-radius:5px;padding:2px 7px;white-space:nowrap;border:1px solid var(--line);font-family:var(--mono);}
.bp{background:rgba(139,92,246,.14);color:#C4B5FD;border:1px solid rgba(139,92,246,.22);}
.bv{background:rgba(20,184,166,.14);color:#5EEAD4;border:1px solid rgba(20,184,166,.22);}
.wkb{background:rgba(201,168,76,.11);border:1px solid rgba(201,168,76,.2);color:var(--gold);font-size:9px;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-weight:600;letter-spacing:.05em;}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;}
.err-panel{text-align:center;padding:2rem 1rem;}
.err-panel p{color:#FCA5A5;font-size:13px;margin-bottom:1rem;}
.btn-retry{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text2);font-family:var(--sans);font-size:12px;padding:8px 18px;border-radius:var(--r);cursor:pointer;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--bnh);background:rgba(7,9,15,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:300;padding-bottom:env(safe-area-inset-bottom,0px);}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 18px;-webkit-tap-highlight-color:transparent;color:var(--text3);font-family:var(--sans);}
.nb.on{color:var(--gold2);}
.nbi{font-size:20px;line-height:1;}
.nbl{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;}
.nbd{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:1px;opacity:0;transition:opacity .18s;}
.nb.on .nbd{opacity:1;}

@media(min-width:700px){.bnav{display:none;}.wrap{padding-bottom:2rem;}}
@media(max-width:420px){.hero-title{font-size:22px;}.kpi-n{font-size:26px;}.cr{padding-left:13px;grid-template-columns:1fr;}.cd{text-align:left;}.cvstats{gap:1.25rem;}.cstn{font-size:24px;}}
</style>
</head>
<body>

<!-- COVER -->
<div id="cover">
  <div class="cvbg"></div>
  <div class="cvgrid"></div>
  <div class="corner ctl"></div><div class="corner ctr"></div>
  <div class="corner cbl"></div><div class="corner cbr"></div>
  <div class="cvsymbol">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
      <path d="M36 6L66 36L36 66L6 36Z" stroke="#C9A84C" stroke-width="1.2" fill="none"/>
      <path d="M36 6L36 66" stroke="#C9A84C" stroke-width="0.6" opacity=".35"/>
      <path d="M6 36L66 36" stroke="#C9A84C" stroke-width="0.6" opacity=".35"/>
      <path d="M36 6L66 36L36 66L6 36Z" stroke="rgba(201,168,76,0.15)" stroke-width="8" fill="none"/>
      <circle cx="36" cy="36" r="4.5" fill="#C9A84C"/>
      <circle cx="36" cy="36" r="9" stroke="#C9A84C" stroke-width="0.6" opacity=".3" fill="none"/>
    </svg>
  </div>
  <div class="cvbrand">
    <div class="cvname">Bombardier</div>
    <div class="cvrule"></div>
    <div class="cvsub">Training Schedule</div>
    <div class="cvyear" id="cvyr"></div>
  </div>
  <div class="cvstats">
    <div class="cst"><div class="cstn" id="cs1">—</div><div class="cstl">Registros</div></div>
    <div class="cstd"></div>
    <div class="cst"><div class="cstn" id="cs2">—</div><div class="cstl">Agentes</div></div>
    <div class="cstd"></div>
    <div class="cst"><div class="cstn" id="cs3">—</div><div class="cstl">Cursos</div></div>
  </div>
  <div class="cvcta">
    <button class="btnenter" id="btnenter" onclick="enterApp()">
      Ver cursos <span class="btnarr">→</span>
    </button>
  </div>
  <div class="cv-loading" id="cvload">Sincronizando datos...</div>
  <div class="cv-err" id="cverr">No se pudieron cargar los datos. Verifica tu conexión.</div>
</div>

<!-- APP -->
<div id="app">
  <header class="hdr">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" style="flex-shrink:0;">
        <path d="M14 2L26 14L14 26L2 14Z" stroke="#C9A84C" stroke-width="1.1" fill="none"/>
        <circle cx="14" cy="14" r="2.5" fill="#C9A84C"/>
      </svg>
      <div>
        <div class="logo-brand">Bombardier</div>
        <div class="logo-div">Training Schedule</div>
      </div>
    </div>
    <div class="live-pill"><span class="live-dot"></span>Live</div>
  </header>

  <div class="wrap">
    <div class="sect" id="s1">
      <div class="hero">
        <div class="hero-bg"></div><div class="hero-grid"></div>
        <div class="hero-inner">
          <div class="hero-top">
            <div>
              <div class="hero-eyebrow">Capacitación · <span id="yr"></span></div>
              <div class="hero-title">Cursos <em>programados</em></div>
            </div>
            <div class="hero-pill" id="wkrange">—</div>
          </div>
          <div class="kpis">
            <div class="kpi"><div class="kpi-n" id="kn1">—</div><div class="kpi-l">Registros</div></div>
            <div class="kpi"><div class="kpi-n" id="kn2">—</div><div class="kpi-l">Agentes</div></div>
            <div class="kpi"><div class="kpi-n" id="kn3">—</div><div class="kpi-l">Cursos</div></div>
          </div>
          <div class="mrow" id="mrow"></div>
        </div>
      </div>
    </div>
    <div class="sect" id="s2"><div class="rule"></div></div>
    <div class="sect" id="s3">
      <div class="last-upd" id="lupd"></div>
      <div class="panel">
        <div class="tabs">
          <button class="tbtn on" onclick="sv('agente',this)">Por agente</button>
          <button class="tbtn" onclick="sv('curso',this)">Por curso</button>
          <button class="tbtn" onclick="sv('fecha',this)">Por fecha</button>
        </div>
        <div class="sbar">
          <div class="sinner">
            <span class="sico">⌕</span>
            <input type="text" id="sq" placeholder="Buscar agente, curso, ubicación…" oninput="rv()"/>
          </div>
        </div>
        <div class="vbody"><div id="vc"></div></div>
      </div>
    </div>
  </div>

  <nav class="bnav">
    <button class="nb on" onclick="mn('agente',this)"><span class="nbi">👤</span><span class="nbl">Agente</span><span class="nbd"></span></button>
    <button class="nb" onclick="mn('curso',this)"><span class="nbi">📚</span><span class="nbl">Curso</span><span class="nbd"></span></button>
    <button class="nb" onclick="mn('fecha',this)"><span class="nbi">📅</span><span class="nbl">Fecha</span><span class="nbd"></span></button>
  </nav>
</div>

<script>
/* ── CSV URL ─────────────────────────────────────────────────────────── */
var CSV_URL = 'https://raw.githubusercontent.com/samu1045/cursos-bombardier/main/CURSOS%20PARA%20CLAUDE%20(Actualizar%20constante).csv';

/* ── GLOBALS ─────────────────────────────────────────────────────────── */
var DATA = [];
var dataReady = false;

/* ── CSV PARSER ──────────────────────────────────────────────────────── */
function parseCSV(text) {
  var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
  if (lines.length < 2) return [];
  var headers = lines[0].split(',').map(function(h){ return h.trim().replace(/^"|"$/g,'').toLowerCase(); });

  function fi(kws) {
    return headers.findIndex(function(h){ return kws.some(function(k){ return h.indexOf(k) > -1; }); });
  }
  var iC  = fi(['nombre curso','curso','course','capacitaci']);
  var iA  = fi(['usuario','nombre','agente','name','user']);
  var iH  = fi(['hora','time','horario']);
  var iDi = fi(['fecha_inicio','fecha inicio','start','inicio']);
  var iDf = fi(['fecha_final','fecha fin','fecha_fin','end','fin','final']);
  var iDr = fi(['duracion','duración','dur','hours','horas','hrs']);
  var iM  = fi(['modalidad','modality','mode']);
  var iU  = fi(['ubicacion','ubicación','location','lugar']);
  var iW  = fi(['week','semana','wk']);

  var result = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = splitCSVLine(lines[i]);
    if (cols.length < 2) continue;
    function g(idx){ return idx >= 0 ? (cols[idx]||'').trim().replace(/^"|"$/g,'') : ''; }
    var nombre = g(iC), agente = g(iA);
    if (!nombre || !agente) continue;
    result.push({
      c: nombre, a: agente,
      h: g(iH), di: g(iDi), df: g(iDf),
      dur: g(iDr), m: g(iM), u: g(iU),
      w: parseInt(g(iW)) || 0
    });
  }
  return result;
}

function splitCSVLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur);
  return result;
}

/* ── FETCH DATA ──────────────────────────────────────────────────────── */
function fetchData(cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', CSV_URL + '?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var parsed = parseCSV(xhr.responseText);
        cb(null, parsed);
      } else {
        cb('HTTP ' + xhr.status, null);
      }
    }
  };
  xhr.onerror = function() { cb('Network error', null); };
  xhr.send();
}

/* ── INIT LOAD ───────────────────────────────────────────────────────── */
var now = new Date();
document.getElementById('cvyr').textContent = 'Año ' + now.getFullYear();
document.getElementById('yr').textContent = now.getFullYear();
document.getElementById('hdr-date') && (document.getElementById('hdr-date').textContent = now.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase());

fetchData(function(err, parsed) {
  if (err || !parsed || parsed.length === 0) {
    document.getElementById('cvload').style.display = 'none';
    document.getElementById('cverr').style.display = 'block';
    return;
  }
  DATA = parsed;
  dataReady = true;
  /* update cover stats */
  var agents = {}, courses = {};
  DATA.forEach(function(d){ agents[d.a]=1; courses[d.c]=1; });
  document.getElementById('cs1').textContent = DATA.length;
  document.getElementById('cs2').textContent = Object.keys(agents).length;
  document.getElementById('cs3').textContent = Object.keys(courses).length;
  document.getElementById('cvload').textContent = '\u2713 Datos actualizados';
  document.getElementById('lupd').textContent = 'Última actualización: ' + now.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
});

/* ── ENTER APP ───────────────────────────────────────────────────────── */
function enterApp() {
  if (!dataReady) return;
  var cover = document.getElementById('cover');
  var app = document.getElementById('app');
  cover.classList.add('hide');
  app.classList.add('show');
  initDash();
  rv();
  ['s1','s2','s3'].forEach(function(id,i){
    setTimeout(function(){ var el=document.getElementById(id); if(el)el.classList.add('in'); }, 120+i*130);
  });
  setTimeout(function(){ cover.style.display='none'; }, 800);
}

/* ── HELPERS ─────────────────────────────────────────────────────────── */
function pd(s){if(!s)return null;var p=s.split('/');if(p.length===3)return new Date(p[2]+'-'+p[0].padStart(2,'0')+'-'+p[1].padStart(2,'0')+'T12:00:00');var p2=s.split('-');if(p2.length===3)return new Date(s+'T12:00:00');return null;}
function fd(s){var d=pd(s);if(!d||isNaN(d))return s;return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
function fr(a,b){if(!a)return'';var x=fd(a),y=(b&&b!==a)?fd(b):'';return y?x+' \u2013 '+y:x;}
function fm(s){var d=pd(s);if(!d||isNaN(d))return'Sin fecha';return d.toLocaleDateString('es-MX',{month:'long',year:'numeric'});}
function sk(s){var d=pd(s);return(d&&!isNaN(d))?d.getTime():Infinity;}
function pm(s){if(!s)return 0;s=s.replace(/\s*(hrs|HRS|h)\s*/,'');var p=s.split(':');return(parseInt(p[0])||0)*60+(parseInt(p[1])||0);}
function fdur(s){var m=pm(s);if(!m)return s;var h=Math.floor(m/60),mn=m%60;if(h===0)return mn+'min';if(h<8)return h+'h'+(mn?mn+'m':'');return h+'h';}
function ce(h,d){if(!h||!d)return'';var p=h.split(':'),t=parseInt(p[0])*60+parseInt(p[1])+pm(d),eh=Math.floor(t/60)%24,em=t%60;return(''+eh).padStart(2,'0')+':'+(''+em).padStart(2,'0');}
function ini(n){return(n||'').trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
var AV=[['rgba(37,99,235,.24)','#93C5FD'],['rgba(16,185,129,.22)','#6EE7B7'],['rgba(245,158,11,.22)','#FCD34D'],['rgba(139,92,246,.22)','#C4B5FD'],['rgba(239,68,68,.22)','#FCA5A5'],['rgba(20,184,166,.22)','#5EEAD4'],['rgba(236,72,153,.20)','#F9A8D4'],['rgba(107,114,128,.22)','#D1D5DB']];
var DP=['#3B82F6','#10B981','#F59E0B','#8B5CF6','#EF4444','#14B8A6','#EC4899','#6B7280'];
var am={},dm={},ai=0,dci=0;
function ac(n){if(!am[n]){am[n]=AV[ai%AV.length];ai++;}return am[n];}
function dco(c){if(!dm[c]){dm[c]=DP[dci%DP.length];dci++;}return dm[c];}
function mb(m){return(m||'').toLowerCase().indexOf('virtual')>-1?'<span class="badge bv">Virtual</span>':'<span class="badge bp">Presencial</span>';}
function chips(r){var h='',e=ce(r.h,r.dur);if(r.h)h+='<span class="chip">\u23F0 '+r.h+(e?' \u2013 '+e:'')+'</span>';if(r.dur)h+='<span class="chip">\u23F1 '+fdur(r.dur)+'</span>';if(r.u)h+='<span class="chip">\uD83D\uDCCD '+r.u+'</span>';return h;}
function wkb(w){return w?'<span class="wkb">WK '+w+'</span>':'';}
var uid=0;
function tog(id){var b=document.getElementById('gb'+id),c=document.getElementById('gc'+id);if(b&&c){b.classList.toggle('o');c.classList.toggle('o');}}
function togs(id){var b=document.getElementById('sb'+id),c=document.getElementById('sc'+id);if(b&&c){b.classList.toggle('o');c.classList.toggle('o');}}
function nid(){return++uid;}

/* ── DASHBOARD ───────────────────────────────────────────────────────── */
var amon=null;
function initDash(){
  var weeks=[],agents={},courses={};
  DATA.forEach(function(d){if(d.w)weeks.push(d.w);agents[d.a]=1;courses[d.c]=1;});
  weeks=weeks.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  if(weeks.length) document.getElementById('wkrange').textContent='WK '+weeks[0]+' \u2013 WK '+weeks[weeks.length-1];
  document.getElementById('kn1').textContent=DATA.length;
  document.getElementById('kn2').textContent=Object.keys(agents).length;
  document.getElementById('kn3').textContent=Object.keys(courses).length;
  var months={};
  DATA.forEach(function(d){var k=fm(d.di);months[k]=(months[k]||0)+1;});
  var row=document.getElementById('mrow');row.innerHTML='';
  var all=document.createElement('div');all.className='mc on';all.dataset.m='all';
  all.innerHTML='<div class="mc-l">Todos</div><div class="mc-n">'+DATA.length+'</div><div class="mc-s">'+Object.keys(courses).length+' cursos</div>';
  all.onclick=function(){fmon('all');};row.appendChild(all);
  Object.keys(months).forEach(function(mes){
    var cnt=months[mes],el=document.createElement('div');el.className='mc';el.dataset.m=mes;
    var s=mes.charAt(0).toUpperCase()+mes.slice(1,3);
    el.innerHTML='<div class="mc-l">'+s+'</div><div class="mc-n">'+cnt+'</div><div class="mc-s">registros</div>';
    el.onclick=function(){fmon(mes);};row.appendChild(el);
  });
}
function fmon(m){
  amon=m==='all'?null:m;
  document.querySelectorAll('.mc').forEach(function(c){c.classList.toggle('on',c.dataset.m===m);});
  document.getElementById('sq').value='';rv();
}

/* ── NAVIGATION ──────────────────────────────────────────────────────── */
var VIEW='agente';
function sv(v,el){VIEW=v;document.querySelectorAll('.tbtn').forEach(function(t){t.classList.remove('on');});if(el)el.classList.add('on');document.getElementById('sq').value='';rv();}
function mn(v,el){document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});el.classList.add('on');var map={agente:0,curso:1,fecha:2};document.querySelectorAll('.tbtn')[map[v]].click();}

function filt(){
  var d=DATA.slice();
  if(amon)d=d.filter(function(r){return fm(r.di)===amon;});
  var q=(document.getElementById('sq').value||'').toLowerCase();
  if(q)d=d.filter(function(r){return r.a.toLowerCase().indexOf(q)>-1||r.c.toLowerCase().indexOf(q)>-1||r.u.toLowerCase().indexOf(q)>-1;});
  return d;
}

/* ── RENDER FUNCTIONS ────────────────────────────────────────────────── */
function rAgente(data){
  var g={};data.forEach(function(d){if(!g[d.a])g[d.a]=[];g[d.a].push(d);});
  var keys=Object.keys(g).sort(function(a,b){return a.localeCompare(b);});
  var h='<div class="eyebrow">'+keys.length+' agente'+(keys.length>1?'s':'')+'</div>';
  keys.forEach(function(name,i){
    var rows=g[name],av=ac(name),id=nid();
    var th=Math.floor(rows.reduce(function(s,r){return s+pm(r.dur);},0)/60);
    h+='<div class="gc"><div class="gh" onclick="tog('+id+')"><div class="gav" style="background:'+av[0]+';color:'+av[1]+'">'+ini(name)+'</div><div class="gi"><div class="gn">'+name+'</div><div class="gs">'+rows.length+' curso'+(rows.length>1?'s':'')+(th?' · '+th+'h':'')+'</div></div><span class="chv'+(i===0?' o':'')+'" id="gc'+id+'">▶</span></div><div class="gb'+(i===0?' o':'')+'" id="gb'+id+'">';
    rows.sort(function(a,b){return sk(a.di)-sk(b.di);}).forEach(function(r){
      h+='<div class="cr"><div><div class="cn">'+r.c+'</div><div class="cc">'+mb(r.m)+wkb(r.w)+'</div><div class="cc">'+chips(r)+'</div></div><div><div class="cd">'+fr(r.di,r.df)+'</div></div></div>';
    });
    h+='</div></div>';
  });
  return h;
}
function rCurso(data){
  var g={};data.forEach(function(d){if(!g[d.c])g[d.c]=[];g[d.c].push(d);});
  var keys=Object.keys(g).sort(function(a,b){return a.localeCompare(b);});
  var h='<div class="eyebrow">'+keys.length+' curso'+(keys.length>1?'s':'')+'</div>';
  keys.forEach(function(curso,i){
    var rows=g[curso],id=nid();
    var dur=rows[0]&&rows[0].dur?' · '+fdur(rows[0].dur)+' c/u':'';
    h+='<div class="gc"><div class="gh" onclick="tog('+id+')"><div class="gav" style="background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.24);color:#E2C06A;border-radius:50%;">'+ini(curso)+'</div><div class="gi"><div class="gn">'+curso+'</div><div class="gs">'+rows.length+' agente'+(rows.length>1?'s':'')+dur+'</div></div><span class="chv'+(i===0?' o':'')+'" id="gc'+id+'">▶</span></div><div class="gb'+(i===0?' o':'')+'" id="gb'+id+'"><div class="ibar">'+chips(rows[0])+mb(rows[0].m)+wkb(rows[0].w)+'</div>';
    rows.sort(function(a,b){return a.a.localeCompare(b.a);}).forEach(function(r){
      var av=ac(r.a),sd=r.di===rows[0].di;
      h+='<div class="ar"><div class="aav" style="background:'+av[0]+';color:'+av[1]+'">'+ini(r.a)+'</div><span class="an">'+r.a+'</span><div class="ach">'+(sd?'':'<span class="chip">📅 '+fr(r.di,r.df)+'</span>')+'</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}
function rFecha(data){
  var sorted=data.slice().sort(function(a,b){return sk(a.di)-sk(b.di)||(a.h||'').localeCompare(b.h||'');});
  var months={};sorted.forEach(function(d){var k=fm(d.di);if(!months[k])months[k]=[];months[k].push(d);});
  var mkeys=Object.keys(months);
  var h='<div class="eyebrow">'+mkeys.length+' mes'+(mkeys.length>1?'es':'')+'</div>';
  mkeys.forEach(function(mes,i){
    var rows=months[mes],id=nid();
    var th=Math.floor(rows.reduce(function(s,r){return s+pm(r.dur);},0)/60);
    var cu={};rows.forEach(function(r){cu[r.c]=1;});
    var cuN=Object.keys(cu).length;
    var wks={};rows.forEach(function(r){if(r.w)wks[r.w]=1;});
    var wkArr=Object.keys(wks).map(Number).sort(function(a,b){return a-b;});
    var wt=wkArr.length?'WK'+wkArr[0]+(wkArr.length>1?'\u2013'+wkArr[wkArr.length-1]:''):'';
    var s=mes.slice(0,3).toUpperCase();
    h+='<div class="gc"><div class="gh" onclick="tog('+id+')"><div class="gav" style="background:rgba(201,168,76,.10);border:1px solid rgba(201,168,76,.18);color:#C9A84C;border-radius:10px;font-family:var(--mono);font-size:10px;font-weight:600;">'+s+'</div><div class="gi"><div class="gn" style="text-transform:capitalize;">'+mes+'</div><div class="gs">'+cuN+' cursos · '+rows.length+' agentes'+(wt?' · '+wt:'')+'</div></div><span class="gm">'+(th?th+'h':'')+'</span><span class="chv'+(i===0?' o':'')+'" id="gc'+id+'">▶</span></div><div class="gb'+(i===0?' o':'')+'" id="gb'+id+'">';
    var cg={};rows.forEach(function(r){if(!cg[r.c])cg[r.c]=[];cg[r.c].push(r);});
    Object.keys(cg).forEach(function(curso){
      var crows=cg[curso],sid=nid(),dotc=dco(curso);
      h+='<div class="sb"><div class="shd" onclick="togs('+sid+')"><div class="sdot" style="background:'+dotc+'"></div><span class="sn">'+curso+'</span><span class="sm">'+crows.length+' · '+fr(crows[0].di,crows[0].df)+'</span><span class="sc o" id="sc'+sid+'">▶</span></div><div class="sbdy o" id="sb'+sid+'"><div class="ibar">'+chips(crows[0])+mb(crows[0].m)+wkb(crows[0].w)+'</div>';
      crows.sort(function(a,b){return a.a.localeCompare(b.a);}).forEach(function(r){
        var av=ac(r.a);
        h+='<div class="ar"><div class="aav" style="background:'+av[0]+';color:'+av[1]+'">'+ini(r.a)+'</div><span class="an">'+r.a+'</span></div>';
      });
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}
function rv(){
  uid=0;
  var data=filt(),el=document.getElementById('vc');
  if(!data.length){el.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  if(VIEW==='agente')el.innerHTML=rAgente(data);
  else if(VIEW==='curso')el.innerHTML=rCurso(data);
  else el.innerHTML=rFecha(data);
}
</script>
</body>
</html>
