<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal · Quality PU1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #F0EDE6;
  --surface: #FAFAF7;
  --card:    #FFFFFF;
  --border:  #E0DDD6;
  --border2: #D0CDC6;
  --text:    #111111;
  --text2:   #555550;
  --text3:   #999990;
  --yellow:  #F5C400;
  --ydim:    rgba(245,196,0,0.13);
  --ytext:   #7A5E00;
  --green:   #2D6A3F;
  --greenbg: rgba(45,106,63,0.1);
  --blue:    #185FA5;
  --bluebg:  rgba(26,79,138,0.1);
  --pink:    #993556;
  --pinkbg:  rgba(153,53,86,0.1);
  --amber:   #854F0B;
  --amberbg: rgba(133,79,11,0.1);
  --r:  10px;
  --rs: 7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 110%,rgba(245,196,0,0.1) 0%,transparent 70%);pointer-events:none}
.s-item{opacity:0;transform:translateY(28px);animation:fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) forwards}
.s-item:nth-child(1){animation-delay:.10s}
.s-item:nth-child(2){animation-delay:.25s}
.s-item:nth-child(3){animation-delay:.38s}
.s-item:nth-child(4){animation-delay:.50s}
.s-item:nth-child(5){animation-delay:.62s}
.s-item:nth-child(6){animation-delay:.76s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
#splash.hide{animation:splashOut .55s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes splashOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
.s-badge{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ytext);border:1px solid rgba(245,196,0,.45);background:var(--ydim);padding:5px 12px;border-radius:20px;margin-bottom:28px}
.s-title{font-family:'Syne',sans-serif;font-size:clamp(32px,7vw,52px);font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1.05;text-align:center;margin-bottom:10px}
.s-title span{color:var(--ytext)}
.s-sub{font-size:13px;font-weight:300;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:40px}
.s-divider{width:36px;height:2px;background:var(--yellow);border-radius:2px;margin-bottom:40px}
.s-stats{display:flex;gap:32px;margin-bottom:48px}
.s-stat{text-align:center}
.s-stat-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);line-height:1;display:block}
.s-stat-label{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;display:block}
.s-enter{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ytext);background:var(--yellow);border:none;padding:13px 30px;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.s-enter:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(245,196,0,.28)}

/* ── APP ── */
#app{display:none;opacity:0;animation:appIn .5s ease forwards}
@keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-badge{width:32px;height:32px;background:var(--yellow);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:12px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);line-height:1.2}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.06em}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .4s}
.dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(45,106,63,.18)}
.dot.err{background:#E24B4A}

/* ── MAIN TABS ── */
.main-tabs{display:flex;gap:3px;padding:8px 16px 0}
.mtab{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:none;color:var(--text3);padding:8px 14px 11px;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mtab:hover{color:var(--text2)}
.mtab.active{color:var(--ytext);border-bottom-color:var(--yellow)}
.mtab i{font-size:14px}

/* ── SUB TABS ── */
.sub-tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.stab{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:none;color:var(--text3);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap}
.stab:hover{color:var(--text2)}
.stab.active{color:var(--ytext);border-bottom-color:var(--yellow)}

/* ── SEARCH ── */
.search-wrap{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:var(--rs);outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--border2)}

/* ── CONTENT ── */
.content{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.page{display:none}.page.active{display:block}

/* ── STATE ── */
.state-msg{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
.state-msg .icon{font-size:28px;display:block;margin-bottom:12px}

/* ── SECTION LABEL ── */
.section-heading{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:20px 0 8px}
.section-heading:first-child{margin-top:0}

/* ── GROUP CARDS ── */
.group-card{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s;gap:10px}
.group-header:hover{background:#FAFAF5}
.group-header.open{background:#FFFDF0}
.group-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.group-avatar{width:28px;height:28px;background:var(--ydim);border:1px solid rgba(245,196,0,.2);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:700;font-size:10px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.04em}
.group-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.group-count{font-size:10px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap}
.chevron{color:var(--border2);font-size:12px;transition:transform .28s cubic-bezier(.22,1,.36,1);flex-shrink:0}
.group-card.open .chevron{transform:rotate(180deg)}
.group-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.22,1,.36,1)}
.group-card.open .group-body{max-height:2000px}
.group-body-inner{border-top:1px solid var(--border);padding:4px 0}

/* ── ROWS ── */
.row{display:grid;grid-template-columns:1fr auto;align-items:start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bg);transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(0,0,0,.02)}
.row-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;margin-bottom:3px}
.row-sub{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row-sub-dot{width:2px;height:2px;background:var(--border2);border-radius:50%}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:5px;white-space:nowrap}
.badge-virtual{background:var(--bluebg);color:var(--blue)}
.badge-presencial{background:var(--greenbg);color:var(--green)}
.badge-completado{background:var(--greenbg);color:var(--green)}
.badge-pendiente{background:var(--amberbg);color:var(--amber)}
.badge-gray{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.time-text{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap}

/* ── EMPLOYEE LIST ── */
.emp-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.emp-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background .15s}
.emp-header:hover{background:#FAFAF5}
.emp-header.open{background:#FFFDF0}
.emp-av{width:34px;height:34px;border-radius:9px;background:var(--ydim);border:1px solid rgba(245,196,0,.25);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emp-av.leader{background:rgba(26,79,138,.1);border-color:rgba(26,79,138,.25);color:var(--blue)}
.emp-av.focal{background:rgba(133,79,11,.1);border-color:rgba(133,79,11,.25);color:var(--amber)}
.emp-info{flex:1;min-width:0}
.emp-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-role{font-size:11px;color:var(--text3);margin-top:1px}
.emp-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.emp-chevron{color:var(--border2);font-size:12px;transition:transform .28s cubic-bezier(.22,1,.36,1)}
.emp-row.open .emp-chevron{transform:rotate(180deg)}

/* ── DETAIL ── */
.emp-detail{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.22,1,.36,1)}
.emp-row.open .emp-detail{max-height:600px}
.emp-detail-inner{border-top:1px solid var(--border);padding:13px 14px;background:#FFFDF5}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ic{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.il{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.iv{font-size:12px;font-weight:600;color:var(--text)}
.iv.bl{color:var(--blue)}.iv.gr{color:var(--green)}.iv.am{color:var(--amber)}.iv.pk{color:var(--pink)}.iv.yt{color:var(--ytext)}

.week-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-bottom:10px}
.wl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center}
.wdn{font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase}
.wdc{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin:0 auto;cursor:pointer;transition:opacity .15s}
.wdc:hover{opacity:.8}
.dc-1{background:#E6F1FB;color:#0C447C}
.dc-2{background:#EAF3DE;color:#27500A}
.dc-3{background:#FAEEDA;color:#633806}
.dc-4{background:#EEEDFE;color:#3C3489}
.dc-V{background:#FBEAF0;color:#72243E}
.dc-P{background:#F1EFE8;color:#5F5E5A}
.dc-I{background:#FCEBEB;color:#791F1F}
.dc-C{background:rgba(245,196,0,.15);color:#7A5E00}
.dc-S{background:#EAF3DE;color:#085041}
.dc-D{background:#E1F5EE;color:#085041}
.dc-X{background:#F1EFE8;color:#888780}
.dc-VP{background:#FBEAF0;color:#993556}
.dc-off{background:#F1EFE8;color:#B4B2A9}
.dc-today{border:2px solid var(--yellow) !important}

.nc-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-bottom:10px}
.ncl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nct{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.ncm{font-size:11px;color:var(--text3)}

/* ── RESPONSABLES ── */
.resp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.resp-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.resp-av{width:40px;height:40px;border-radius:10px;background:var(--ydim);border:1px solid rgba(245,196,0,.3);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.resp-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.resp-role{font-size:11px;color:var(--text3);margin-top:2px}
.resp-links{display:flex;gap:8px}
.plink{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text2);text-decoration:none;font-size:11px;font-weight:500;transition:all .18s;white-space:nowrap}
.plink:hover{background:var(--border);color:var(--text)}
.plink.wa{color:var(--green);background:var(--greenbg);border-color:rgba(45,106,63,.2)}
.plink.wa:hover{background:rgba(45,106,63,.18);border-color:rgba(45,106,63,.35)}
.plink.em{color:var(--blue);background:var(--bluebg);border-color:rgba(26,79,138,.2)}
.plink.em:hover{background:rgba(26,79,138,.18)}

/* ── SCROLL REVEAL ── */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .38s ease,transform .38s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<!-- ═══ SPLASH ═══ -->
<div id="splash">
  <div class="s-item s-badge">Quality PU1 · Bombardier</div>
  <div class="s-item s-title">SBU<br><span>Team</span></div>
  <div class="s-item s-sub">Querétaro · 2026</div>
  <div class="s-item s-divider"></div>
  <div class="s-item s-stats">
    <div class="s-stat"><span class="s-stat-num" id="stat-miembros">—</span><span class="s-stat-label">Miembros</span></div>
    <div class="s-stat"><span class="s-stat-num" id="stat-cursos">—</span><span class="s-stat-label">Cursos</span></div>
    <div class="s-stat"><span class="s-stat-num" id="stat-areas">—</span><span class="s-stat-label">Áreas</span></div>
  </div>
  <div class="s-item">
    <button class="s-enter" onclick="enterApp()">Entrar al Portal →</button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <header>
    <div class="hdr-top">
      <div class="logo-area">
        <div class="logo-badge">QU</div>
        <div>
          <div class="logo-title">Portal · Quality PU1</div>
          <div class="logo-sub">Bombardier</div>
        </div>
      </div>
      <div class="sync-badge">
        <span class="dot" id="dot"></span>
        <span id="sync-text">cargando…</span>
      </div>
    </div>
    <div class="main-tabs">
      <button class="mtab active" id="mtab-cursos" onclick="switchMain('cursos',this)">
        &#128218; Cursos
      </button>
      <button class="mtab" id="mtab-equipo" onclick="switchMain('equipo',this)">
        &#128101; Equipo
      </button>
    </div>
  </header>

  <!-- ══ CURSOS PAGE ══ -->
  <div id="page-cursos" class="page active">
    <div class="sub-tabs" id="subtabs-cursos">
      <button class="stab active" onclick="switchSub('cursos','agente',this)">Por Agente</button>
      <button class="stab" onclick="switchSub('cursos','curso',this)">Por Curso</button>
      <button class="stab" onclick="switchSub('cursos','fecha',this)">Por Fecha</button>
      <button class="stab" onclick="switchSub('cursos','completados',this)">Completados</button>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="text" id="search-cursos" placeholder="Buscar curso o agente…" oninput="renderCursos()">
    </div>
    <div class="content" id="content-cursos">
      <div class="state-msg"><span class="icon">⏳</span>Cargando…</div>
    </div>
  </div>

  <!-- ══ EQUIPO PAGE ══ -->
  <div id="page-equipo" class="page">
    <div class="sub-tabs" id="subtabs-equipo">
      <button class="stab active" onclick="switchSub('equipo','directorio',this)">Directorio</button>
      <button class="stab" onclick="switchSub('equipo','responsables',this)">Our People</button>
    </div>
    <div class="search-wrap" id="search-wrap-equipo">
      <input class="search-input" type="text" id="search-equipo" placeholder="Buscar empleado…" oninput="renderEquipo()">
    </div>
    <div class="content" id="content-equipo">
      <div class="state-msg"><span class="icon">⏳</span>Cargando…</div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──
const SB_URL = 'https://andtyljudrsymincblaf.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuZHR5bGp1ZHJzeW1pbmNibGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTUzNDUsImV4cCI6MjA5NjIzMTM0NX0.VN1gIifS7T_KX89_LOaIDbGAaPuEgR_gWLibT6mOhR4';
const HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

const TEAM_CONTACTS = {
  'Samuel Mejia':  { wa: '524424512999', email: 'samuel.mejia@bombardier.com' },
  'Omar Balderas': { wa: '524427226388', email: 'omar.balderas@bombardier.com' }
};

const SECTION_ORDER = ['Quality Leader','Focales','650','3500','CHECO 2'];
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── STATE ──
let cursosData   = [];
let empleadosData = [];
let turnosData   = [];
let activeCursoTab  = 'agente';
let activeEquipoTab = 'directorio';
let activeMainTab   = 'cursos';
let openGroups   = {};
let openEmps     = {};

// ── FETCH ──
async function sb(table, params='') {
  const res = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers: HEADERS });
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  return res.json();
}

async function loadAll() {
  console.log('[Portal] Loading data…');
  try {
    const [cursos, empleados, turnos] = await Promise.all([
      sb('Cursos', 'select=*&order=fecha_inicio.asc'),
      sb('Empleados', 'select=*&order=seccion.asc,nombre.asc&activo=eq.true'),
      sb('Turnos', 'select=*')
    ]);
    cursosData    = cursos;
    empleadosData = empleados;
    turnosData    = turnos;

    const areas = new Set(empleados.map(e => e.seccion)).size;
    animCount('stat-miembros', empleados.length);
    animCount('stat-cursos',   cursos.length);
    animCount('stat-areas',    areas);

    setSyncState('live', 'En vivo');
    console.log('[Portal] Loaded — cursos:', cursos.length, 'empleados:', empleados.length);
  } catch(e) {
    console.error('[Portal] Error:', e);
    setSyncState('err', 'Error');
    ['content-cursos','content-equipo'].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="state-msg"><span class="icon">⚠️</span>Error al conectar con Supabase.</div>';
    });
  }
}

function setSyncState(s, t) {
  document.getElementById('dot').className = 'dot ' + s;
  document.getElementById('sync-text').textContent = t;
}

function animCount(id, target) {
  const el = document.getElementById(id);
  if (!el) return;
  let i = 0; const steps = 30, dur = 900;
  const iv = setInterval(() => { i++; el.textContent = Math.round(target*(i/steps)); if(i>=steps){el.textContent=target;clearInterval(iv);} }, dur/steps);
}

// ── NAVIGATION ──
function switchMain(tab, btn) {
  activeMainTab = tab;
  document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+tab).classList.add('active');
  if (tab === 'cursos') renderCursos();
  if (tab === 'equipo') renderEquipo();
}

function switchSub(page, tab, btn) {
  btn.closest('.sub-tabs').querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (page === 'cursos') { activeCursoTab = tab; openGroups = {}; renderCursos(); }
  if (page === 'equipo') {
    activeEquipoTab = tab;
    document.getElementById('search-wrap-equipo').style.display = tab === 'responsables' ? 'none' : '';
    openEmps = {};
    renderEquipo();
  }
}

// ── DATE UTILS ──
function parseDate(s) {
  if (!s) return null;
  if (s.includes('/')) { const [m,d,y]=s.split('/'); return new Date(+y,+m-1,+d); }
  const [y,m,d]=s.split('-'); return new Date(+y,+m-1,+d);
}
function fmtDate(s) {
  const d = parseDate(s); if (!d) return s||'—';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}
function fmtTime(t) {
  if (!t) return '—';
  const [h,m] = t.split(':'); let hh=parseInt(h); const ap=hh>=12?'PM':'AM'; hh=hh%12||12;
  return `${hh}:${m||'00'} ${ap}`;
}
function endTime(hora, dur) {
  if (!hora||!dur) return null;
  const [h,m]=hora.split(':').map(Number); const tot=h*60+m+Math.round(parseFloat(dur)*60);
  const eh=Math.floor(tot/60)%24,em=tot%60;
  return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}:00`;
}
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── TODAY WEEK ──
function getWeekDates() {
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay(); // 0=sun
  const mon = new Date(today); mon.setDate(today.getDate() - (dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}

function buildWeekStrip(empId) {
  const days = getWeekDates();
  const today = new Date(); today.setHours(0,0,0,0);
  const DAY_NAMES = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let html = '<div class="week-box"><div class="wl">Esta semana</div><div class="wdays">';
  days.forEach((d,i) => {
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const turno = turnosData.find(t => t.empleado_id === empId && t.fecha === iso);
    const code  = turno ? turno.codigo : (i>=5 ? 'off' : '—');
    const cls   = turno ? `dc-${esc(turno.codigo)}` : 'dc-off';
    const todayCls = d.getTime()===today.getTime() ? ' dc-today' : '';
    html += `<div class="wd"><div class="wdn">${DAY_NAMES[i]}</div><div class="wdc ${cls}${todayCls}">${esc(code)}</div></div>`;
  });
  html += '</div></div>';
  return html;
}

function buildNextCourse(nombre) {
  const today = new Date(); today.setHours(0,0,0,0);
  const next = cursosData.filter(r => {
    if ((r.status||'pendiente') === 'completado') return false;
    if ((r.usuario||'').toLowerCase() !== nombre.toLowerCase()) return false;
    const d = parseDate(r.fecha_inicio); return d && d >= today;
  }).sort((a,b)=>{ const da=parseDate(a.fecha_inicio),db=parseDate(b.fecha_inicio); return da-db; })[0];
  if (!next) return '';
  const fin = endTime(next.hora_inicio, next.duracion);
  return `<div class="nc-box"><div class="ncl">Próximo curso</div><div class="nct">${esc(next.nombre_curso||'—')}</div><div class="ncm">${fmtDate(next.fecha_inicio)} · ${fmtTime(next.hora_inicio)}${fin?' – '+fmtTime(fin):''} · ${esc(next.modalidad||'—')}</div></div>`;
}

// ── CURSOS RENDER ──
function renderCursos() {
  const q = (document.getElementById('search-cursos').value||'').toLowerCase().trim();
  const content = document.getElementById('content-cursos');
  const isCompletados = activeCursoTab === 'completados';

  let data = cursosData.filter(r => {
    const status = (r.status||'pendiente').toLowerCase();
    if (isCompletados && status !== 'completado') return false;
    if (!isCompletados && status === 'completado') return false;
    if (!q) return true;
    return (r.nombre_curso||'').toLowerCase().includes(q) ||
           (r.usuario||'').toLowerCase().includes(q) ||
           (r.modalidad||'').toLowerCase().includes(q);
  });

  if (!data.length) {
    content.innerHTML = `<div class="state-msg"><span class="icon">${isCompletados?'✅':'🔍'}</span>${isCompletados?'No hay cursos completados aún.':'Sin resultados.'}</div>`;
    return;
  }

  if (activeCursoTab==='agente') renderCursosByKey(data, content, r=>r.usuario||'Sin asignar', 'agente');
  else if (activeCursoTab==='curso') renderCursosByKey(data, content, r=>r.nombre_curso||'Sin nombre', 'curso');
  else if (activeCursoTab==='fecha') renderCursosByFecha(data, content);
  else renderCursosByKey(data, content, r=>r.usuario||'Sin asignar', 'completados');
}

function renderCursosByKey(data, container, keyFn, prefix) {
  const groups = {};
  data.forEach(r => { const k=keyFn(r); if(!groups[k]) groups[k]=[]; groups[k].push(r); });
  let html = '';
  Object.keys(groups).sort().forEach(k => {
    const gkey = prefix+':'+k;
    html += buildGroupCard(gkey, initials(k), k, groups[k], openGroups[gkey]);
  });
  container.innerHTML = html;
  attachGroupListeners();
  scheduleReveal();
}

function renderCursosByFecha(data, container) {
  const months = {};
  data.forEach(r => {
    const d=parseDate(r.fecha_inicio);
    const mk=d?`${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`:'zzz';
    const ml=d?MONTHS_ES[d.getMonth()]+' '+d.getFullYear():'Sin fecha';
    if(!months[mk]) months[mk]={label:ml,courses:{}};
    const ck=r.nombre_curso||'(sin nombre)';
    if(!months[mk].courses[ck]) months[mk].courses[ck]=[];
    months[mk].courses[ck].push(r);
  });
  let html='';
  Object.keys(months).sort().forEach(mk => {
    const {label,courses}=months[mk];
    html+=`<div class="section-heading">${esc(label)}</div>`;
    Object.keys(courses).sort().forEach(ck => {
      const gkey=`fecha:${mk}:${ck}`;
      html+=buildGroupCard(gkey,initials(ck),ck,courses[ck],openGroups[gkey],true);
    });
  });
  container.innerHTML=html;
  attachGroupListeners();
  scheduleReveal();
}

function buildGroupCard(gkey, av, name, items, isOpen, byFecha) {
  const openCls = isOpen?' open':'';
  const count = `${items.length} ${items.length===1?'elemento':'elementos'}`;
  let rows='';
  items.forEach(r => {
    const fin=endTime(r.hora_inicio,r.duracion);
    const mod=(r.modalidad||'').toLowerCase();
    const modCls=mod.includes('virtual')?'badge-virtual':mod.includes('presencial')?'badge-presencial':'badge-gray';
    const dateStr=r.fecha_inicio&&r.fecha_final&&r.fecha_inicio!==r.fecha_final?`${fmtDate(r.fecha_inicio)} – ${fmtDate(r.fecha_final)}`:fmtDate(r.fecha_inicio);
    const sub2=byFecha?esc(r.usuario||'—'):dateStr;
    const statusBadge=(r.status&&r.status==='completado')?`<span class="badge badge-completado">Completado</span>`:'';
    rows+=`<div class="row">
      <div>
        <div class="row-title">${esc(byFecha?r.usuario:r.nombre_curso)}</div>
        <div class="row-sub"><span>${sub2}</span>${r.ubicacion?`<span class="row-sub-dot"></span><span>${esc(r.ubicacion)}</span>`:''}</div>
      </div>
      <div class="row-right">
        ${statusBadge}
        <span class="badge ${modCls}">${esc(r.modalidad||'—')}</span>
        <span class="time-text">${fmtTime(r.hora_inicio)}${fin?' – '+fmtTime(fin):''}</span>
      </div>
    </div>`;
  });
  return `<div class="group-card reveal${openCls}" data-gkey="${esc(gkey)}">
    <div class="group-header${isOpen?' open':''}">
      <div class="group-left"><div class="group-avatar">${esc(av)}</div><div class="group-name">${esc(name)}</div></div>
      <div class="group-meta"><span class="group-count">${count}</span><span class="chevron">▾</span></div>
    </div>
    <div class="group-body"><div class="group-body-inner">${rows}</div></div>
  </div>`;
}

function attachGroupListeners() {
  document.querySelectorAll('.group-header').forEach(h => {
    h.addEventListener('click', () => {
      const card=h.closest('.group-card'); const gkey=card.dataset.gkey;
      const isNowOpen=card.classList.toggle('open');
      h.classList.toggle('open',isNowOpen);
      openGroups[gkey]=isNowOpen;
    });
  });
}

// ── EQUIPO RENDER ──
function renderEquipo() {
  const content = document.getElementById('content-equipo');
  if (activeEquipoTab === 'responsables') { renderResponsables(content); return; }

  const q = (document.getElementById('search-equipo').value||'').toLowerCase().trim();
  const filtered = empleadosData.filter(e => !q || e.nombre.toLowerCase().includes(q) || e.seccion.toLowerCase().includes(q) || e.rol.toLowerCase().includes(q));

  if (!filtered.length) { content.innerHTML='<div class="state-msg"><span class="icon">🔍</span>Sin resultados.</div>'; return; }

  const grouped = {};
  SECTION_ORDER.forEach(s => { grouped[s]=[]; });
  filtered.forEach(e => { if(!grouped[e.seccion]) grouped[e.seccion]=[]; grouped[e.seccion].push(e); });

  let html = '';
  SECTION_ORDER.forEach(sec => {
    const emps = grouped[sec]; if(!emps||!emps.length) return;
    html += `<div class="section-heading">${esc(sec==='650'?'Área 650':sec==='3500'?'Área 3500':sec)}</div>`;
    emps.forEach(e => { html += buildEmpCard(e); });
  });
  content.innerHTML = html;
  attachEmpListeners();
  scheduleReveal();
}

function buildEmpCard(emp) {
  const isOpen = openEmps[emp.id];
  const avCls = emp.seccion==='Quality Leader'?'leader':emp.seccion==='Focales'?'focal':'';
  const rolBadge = emp.our_people?'<span class="badge badge-pendiente" style="font-size:9px">Our People</span>':'';

  let detail = '';
  if (isOpen) {
    const weekStrip = buildWeekStrip(emp.id);
    const nextCourse = buildNextCourse(emp.nombre);
    const today = new Date();
    const turnosThisMonth = turnosData.filter(t => {
      if(t.empleado_id!==emp.id) return false;
      const d=new Date(t.fecha); return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
    });
    const vacs  = turnosThisMonth.filter(t=>t.codigo==='V').length;
    const perms = turnosThisMonth.filter(t=>t.codigo==='P').length;
    const t2    = turnosThisMonth.filter(t=>t.codigo==='2').length;
    const todayIso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const todayTurno=turnosData.find(t=>t.empleado_id===emp.id&&t.fecha===todayIso);
    const estadoHoy=todayTurno?todayTurno.codigo:'T1';
    const estadoCls=estadoHoy==='V'?'pk':estadoHoy==='P'?'am':estadoHoy==='I'?'pk':'gr';

    detail = `<div class="emp-detail-inner">
      <div class="info-grid">
        <div class="ic"><div class="il">Estado hoy</div><div class="iv ${estadoCls}">${esc(estadoHoy==='V'?'Vacaciones':estadoHoy==='P'?'Permiso':estadoHoy==='I'?'Incapacidad':'Activo')}</div></div>
        <div class="ic"><div class="il">Área</div><div class="iv">${esc(emp.seccion)}</div></div>
        <div class="ic"><div class="il">Vac. este mes</div><div class="iv ${vacs>0?'pk':'gr'}">${vacs} día${vacs!==1?'s':''}</div></div>
        <div class="ic"><div class="il">Permisos</div><div class="iv ${perms>0?'am':'gr'}">${perms} día${perms!==1?'s':''}</div></div>
      </div>
      ${weekStrip}
      ${nextCourse}
    </div>`;
  }

  return `<div class="emp-row reveal${isOpen?' open':''}" data-empid="${emp.id}">
    <div class="emp-header${isOpen?' open':''}">
      <div class="emp-av ${avCls}">${esc(initials(emp.nombre))}</div>
      <div class="emp-info">
        <div class="emp-name">${esc(emp.nombre)}</div>
        <div class="emp-role">${esc(emp.rol)}</div>
      </div>
      <div class="emp-right">${rolBadge}<span class="emp-chevron">▾</span></div>
    </div>
    <div class="emp-detail">${detail}</div>
  </div>`;
}

function attachEmpListeners() {
  document.querySelectorAll('.emp-header').forEach(h => {
    h.addEventListener('click', () => {
      const card=h.closest('.emp-row'); const empId=parseInt(card.dataset.empid);
      const isNowOpen=!openEmps[empId];
      openEmps[empId]=isNowOpen;
      renderEquipo();
    });
  });
}

function renderResponsables(container) {
  const resp = empleadosData.filter(e => e.our_people);
  let html = `<div class="section-heading">Responsables Our People</div>`;
  resp.forEach(e => {
    const c = TEAM_CONTACTS[e.nombre]||{};
    html += `<div class="resp-card reveal">
      <div class="resp-top">
        <div class="resp-av">${esc(initials(e.nombre))}</div>
        <div><div class="resp-name">${esc(e.nombre)}</div><div class="resp-role">${esc(e.rol)} · Our People</div></div>
      </div>
      <div class="resp-links">
        ${c.wa?`<a class="plink wa" href="https://wa.me/${c.wa}" target="_blank" rel="noopener">&#128172; WhatsApp</a>`:''}
        ${c.email?`<a class="plink em" href="mailto:${c.email}" target="_blank" rel="noopener">&#9993; Email</a>`:''}
      </div>
    </div>`;
  });
  container.innerHTML = html;
  scheduleReveal();
}

// ── SCROLL REVEAL ──
function scheduleReveal() {
  requestAnimationFrame(() => {
    const els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(el=>el.classList.add('visible')); return; }
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach((e,i)=>{ if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*30);obs.unobserve(e.target);} });
    },{threshold:.05});
    els.forEach(el=>obs.observe(el));
  });
}

// ── ENTER APP ──
function enterApp() {
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    const app=document.getElementById('app'); app.style.display='block';
    renderCursos();
  },520);
}

loadAll();
