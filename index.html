<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F0EDE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Portal · Quality PU1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EDE6;--surface:#FAFAF7;--card:#FFFFFF;--border:#E0DDD6;--border2:#D0CDC6;--text:#111111;--text2:#555550;--text3:#999990;--yellow:#F5C400;--ydim:rgba(245,196,0,0.13);--ytext:#7A5E00;--green:#2D6A3F;--greenbg:rgba(45,106,63,0.1);--blue:#185FA5;--bluebg:rgba(26,79,138,0.1);--pink:#993556;--pinkbg:rgba(153,53,86,0.1);--amber:#854F0B;--amberbg:rgba(133,79,11,0.1);--r:10px;--rs:7px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 110%,rgba(245,196,0,0.1) 0%,transparent 70%);pointer-events:none}
.s-item{opacity:0;transform:translateY(28px);animation:fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) forwards}
.s-item:nth-child(1){animation-delay:.10s}.s-item:nth-child(2){animation-delay:.25s}.s-item:nth-child(3){animation-delay:.38s}.s-item:nth-child(4){animation-delay:.50s}.s-item:nth-child(5){animation-delay:.62s}.s-item:nth-child(6){animation-delay:.76s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
#splash.hide{animation:splashOut .55s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes splashOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
.s-badge{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ytext);border:1px solid rgba(245,196,0,.45);background:var(--ydim);padding:5px 12px;border-radius:20px;margin-bottom:28px}
.s-title{font-family:'Syne',sans-serif;font-size:clamp(32px,7vw,52px);font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1.05;text-align:center;margin-bottom:10px}
.s-title span{color:var(--ytext)}
.s-sub{font-size:13px;font-weight:300;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:40px}
.s-divider{width:36px;height:2px;background:var(--yellow);border-radius:2px;margin-bottom:40px}
.s-stats{display:flex;gap:32px;margin-bottom:48px}
.s-stat{text-align:center}
.s-stat-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);line-height:1;display:block}
.s-stat-label{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;display:block}
.s-enter{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ytext);background:var(--yellow);border:none;padding:13px 30px;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.s-enter:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(245,196,0,.28)}
#app{display:none;opacity:0;animation:appIn .5s ease forwards}
@keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
header{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-badge{width:32px;height:32px;background:var(--yellow);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:12px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);line-height:1.2}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.06em}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .4s}
.dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(45,106,63,.18)}
.dot.err{background:#E24B4A}
.main-tabs{display:flex;gap:3px;padding:8px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.main-tabs::-webkit-scrollbar{display:none}.mtab{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:none;color:var(--text3);padding:8px 14px 11px;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mtab:hover{color:var(--text2)}
.mtab.active{color:var(--ytext);border-bottom-color:var(--yellow)}
.sub-tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.stab{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:none;color:var(--text3);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap}
.stab:hover{color:var(--text2)}
.stab.active{color:var(--ytext);border-bottom-color:var(--yellow)}
.search-wrap{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:var(--rs);outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--border2)}
.content{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.page{display:none}.page.active{display:block}
.state-msg{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
.state-msg .icon{font-size:28px;display:block;margin-bottom:12px}
.section-heading{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:20px 0 8px}
.section-heading:first-child{margin-top:0}
.group-card{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s;gap:10px}
.group-header:hover{background:#FAFAF5}
.group-header.open{background:#FFFDF0}
.group-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.group-avatar{width:28px;height:28px;background:var(--ydim);border:1px solid rgba(245,196,0,.2);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:700;font-size:10px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.04em}
.group-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.group-count{font-size:10px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap}
.chevron{color:var(--border2);font-size:12px;transition:transform .28s cubic-bezier(.22,1,.36,1);flex-shrink:0}
.group-card.open .chevron{transform:rotate(180deg)}
.group-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.22,1,.36,1)}
.group-card.open .group-body{max-height:2000px}
.group-body-inner{border-top:1px solid var(--border);padding:4px 0}
.row{display:grid;grid-template-columns:1fr auto;align-items:start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bg);transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(0,0,0,.02)}
.row-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;margin-bottom:3px}
.row-sub{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row-sub-dot{width:2px;height:2px;background:var(--border2);border-radius:50%}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:5px;white-space:nowrap}
.badge-virtual{background:var(--bluebg);color:var(--blue)}
.badge-presencial{background:var(--greenbg);color:var(--green)}
.badge-completado{background:var(--greenbg);color:var(--green)}
.badge-pendiente{background:var(--amberbg);color:var(--amber)}
.badge-gray{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.time-text{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap}
.emp-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.emp-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background .15s}
.emp-header:hover{background:#FAFAF5}
.emp-header.open{background:#FFFDF0}
.emp-av{width:34px;height:34px;border-radius:9px;background:var(--ydim);border:1px solid rgba(245,196,0,.25);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emp-av.leader{background:rgba(26,79,138,.1);border-color:rgba(26,79,138,.25);color:var(--blue)}
.emp-av.focal{background:rgba(133,79,11,.1);border-color:rgba(133,79,11,.25);color:var(--amber)}
.emp-info{flex:1;min-width:0}
.emp-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-role{font-size:11px;color:var(--text3);margin-top:1px}
.emp-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.emp-chevron{color:var(--border2);font-size:12px;transition:transform .28s cubic-bezier(.22,1,.36,1)}
.emp-row.open .emp-chevron{transform:rotate(180deg)}
.emp-detail{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.22,1,.36,1)}
.emp-row.open .emp-detail{max-height:600px}
.emp-detail-inner{border-top:1px solid var(--border);padding:13px 14px;background:#FFFDF5}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ic{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.il{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.iv{font-size:12px;font-weight:600;color:var(--text)}
.iv.bl{color:var(--blue)}.iv.gr{color:var(--green)}.iv.am{color:var(--amber)}.iv.pk{color:var(--pink)}.iv.yt{color:var(--ytext)}
.week-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-bottom:10px}
.wl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center}
.wdn{font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase}
.wdc{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin:0 auto}
.dc-1{background:#E6F1FB;color:#0C447C}.dc-2{background:#EAF3DE;color:#27500A}.dc-3{background:#FAEEDA;color:#633806}.dc-4{background:#EEEDFE;color:#3C3489}
.dc-V{background:#FBEAF0;color:#72243E}.dc-P{background:#F1EFE8;color:#5F5E5A}.dc-I{background:#FCEBEB;color:#791F1F}.dc-C{background:rgba(245,196,0,.15);color:#7A5E00}
.dc-S{background:#EAF3DE;color:#085041}.dc-D{background:#E1F5EE;color:#085041}.dc-X{background:#F1EFE8;color:#888780}.dc-VP{background:#FBEAF0;color:#993556}
.dc-off{background:#F1EFE8;color:#B4B2A9}.dc-today{border:2px solid var(--yellow)!important}
.nc-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-bottom:10px}
.ncl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nct{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.ncm{font-size:11px;color:var(--text3)}
.resp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.resp-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.resp-av{width:40px;height:40px;border-radius:10px;background:var(--ydim);border:1px solid rgba(245,196,0,.3);color:var(--ytext);font-family:'Syne',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.resp-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.resp-role{font-size:11px;color:var(--text3);margin-top:2px}
.resp-links{display:flex;gap:8px}
.plink{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text2);text-decoration:none;font-size:11px;font-weight:500;transition:all .18s;white-space:nowrap}
.plink.wa{color:var(--green);background:var(--greenbg);border-color:rgba(45,106,63,.2)}
.plink.em{color:var(--blue);background:var(--bluebg);border-color:rgba(26,79,138,.2)}
.vg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.vg-table{border-collapse:collapse;min-width:100%}
.vg-table th{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--text3);text-align:center;padding:4px 3px;white-space:nowrap;background:var(--bg)}
.vg-table th.name-col{text-align:left;padding-left:4px;min-width:110px;position:sticky;left:0;background:var(--bg);z-index:3}
.vg-table td.name-cell{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;padding:4px 6px 4px 4px;position:sticky;left:0;background:var(--card);z-index:1;border-bottom:1px solid var(--bg)}
.vg-table tr:hover td,.vg-table tr:hover td.name-cell{background:#FAFAF5}
.day-cell-vg{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin:2px auto;user-select:none}
.day-cell-vg.editable{cursor:pointer;transition:opacity .15s}
.day-cell-vg.editable:hover{opacity:.75}
.day-cell-vg.today-vg{box-shadow:0 0 0 2px var(--yellow)}
.day-cell-vg.weekend{opacity:.4}
.vg-td{padding:1px 2px;border-bottom:1px solid var(--bg)}
.vg-section-row td{background:var(--bg);font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 4px 3px;border-bottom:1px solid var(--border)}
.edit-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;gap:10px}
.edit-btn{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--yellow);color:var(--ytext);border:none;padding:8px 16px;border-radius:7px;cursor:pointer}
.edit-btn.off{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.edit-badge{font-size:10px;color:var(--green);background:var(--greenbg);border:1px solid rgba(45,106,63,.2);border-radius:5px;padding:4px 10px;font-weight:600}
.vg-nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:13px;padding:6px 13px;border-radius:6px;cursor:pointer}
.pin-overlay{position:fixed;inset:0;background:rgba(240,237,230,.92);display:flex;align-items:center;justify-content:center;z-index:500}
.pin-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px;width:280px;text-align:center}
.pin-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.pin-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.pin-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:background .2s}
.pin-dot.filled{background:var(--ytext)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pin-key{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:13px;cursor:pointer}
.pin-key.del{font-size:13px;color:var(--text3)}
.pin-error{font-size:12px;color:#E24B4A;margin-top:6px;min-height:16px}
.pin-cancel{font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}
.code-overlay{position:fixed;inset:0;background:rgba(240,237,230,.82);display:flex;align-items:flex-end;justify-content:center;z-index:600;padding-bottom:24px}
.code-sheet{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;width:320px}
.code-sheet-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;text-align:center}
.code-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.code-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-radius:8px;cursor:pointer;border:1px solid var(--border);gap:3px}
.code-opt:hover{opacity:.8}
.code-opt-val{font-size:13px;font-weight:700}
.code-opt-lbl{font-size:9px;color:var(--text3);text-align:center;line-height:1.2}
.code-cancel{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .38s ease,transform .38s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}


/* ANTIGUEDAD */
.ant-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;padding:12px 14px;}
.ant-row:hover{background:#FAFAF5;}
.ant-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.ant-av{width:34px;height:34px;border-radius:9px;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.02em;}
.ant-av.r-nuevo{background:var(--greenbg);border:1px solid rgba(45,106,63,.2);color:var(--green);}
.ant-av.r-consol{background:var(--ydim);border:1px solid rgba(245,196,0,.25);color:var(--ytext);}
.ant-av.r-senior{background:var(--bluebg);border:1px solid rgba(26,79,138,.2);color:var(--blue);}
.ant-av.r-veteran{background:var(--pinkbg);border:1px solid rgba(153,53,86,.2);color:var(--pink);}
.ant-info{flex:1;min-width:0;}
.ant-name{font-size:13px;font-weight:600;color:var(--text);}
.ant-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.ant-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ant-years{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--text);line-height:1;}
.ant-years small{font-size:10px;font-weight:600;color:var(--text3);}
.rank-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;}
.rank-nuevo{background:var(--greenbg);color:var(--green);border:1px solid rgba(45,106,63,.15);}
.rank-consol{background:var(--ydim);color:var(--ytext);border:1px solid rgba(245,196,0,.2);}
.rank-senior{background:var(--bluebg);color:var(--blue);border:1px solid rgba(26,79,138,.15);}
.rank-veteran{background:var(--pinkbg);color:var(--pink);border:1px solid rgba(153,53,86,.15);}
.ant-bar-wrap{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.ant-bar-fill{height:100%;border-radius:3px;}
.fill-nuevo{background:var(--green);}
.fill-consol{background:var(--yellow);}
.fill-senior{background:var(--blue);}
.fill-veteran{background:var(--pink);}

<script>
const SB_URL='https://andtyljudrsymincblaf.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuZHR5bGp1ZHJzeW1pbmNibGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTUzNDUsImV4cCI6MjA5NjIzMTM0NX0.VN1gIifS7T_KX89_LOaIDbGAaPuEgR_gWLibT6mOhR4';
const HEADERS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const TEAM_CONTACTS={'Samuel Mejia':{wa:'524424512999',email:'samuel.mejia@bombardier.com'},'Omar Balderas':{wa:'524427226388',email:'omar.balderas@bombardier.com'}};
const SECTION_ORDER=['Quality Leader','Focales','650','3500','CHECO 2'];
const MONTHS_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let cursosData=[],empleadosData=[],turnosData=[];
let activeCursoTab='agente',activeEquipoTab='directorio',activeMainTab='cursos';
let openGroups={},openEmps={};
let editCursosMode=false;
let pendingCurso=null;

async function sb(table,params=''){
  const res=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:HEADERS});
  if(!res.ok){const t=await res.text();throw new Error(`${res.status}: ${t}`);}
  return res.json();
}

async function loadAll(){
  try{
    const[cursos,empleados]=await Promise.all([
      sb('Cursos','select=*&order=fecha_inicio.asc'),
      sb('Empleados','select=*&order=seccion.asc,nombre.asc&activo=eq.true')
    ]);
    cursosData=cursos;empleadosData=empleados;
    sb('Turnos','select=*').then(t=>{turnosData=t;renderSplashSemana();}).catch(e=>console.warn('Turnos:',e));
  loadRecon();
    const areas=new Set(empleados.map(e=>e.seccion)).size;
    animCount('stat-miembros',empleados.length);
    animCount('stat-cursos',cursos.filter(r=>(r.status||'pendiente')!=='completado').length);
    animCount('stat-areas',areas);
    setSyncState('live','En vivo');
  }catch(e){
    console.error('[Portal]',e);
    setSyncState('err','Error');
    ['content-cursos','content-equipo'].forEach(id=>{
      document.getElementById(id).innerHTML='<div class="state-msg"><span class="icon">⚠️</span>Error al conectar.</div>';
    });
  }
}

function setSyncState(s,t){document.getElementById('dot').className='dot '+s;document.getElementById('sync-text').textContent=t;}
function animCount(id,target){
  const el=document.getElementById(id);if(!el)return;
  let i=0;const steps=30,dur=900;
  const iv=setInterval(()=>{i++;el.textContent=Math.round(target*(i/steps));if(i>=steps){el.textContent=target;clearInterval(iv);}},dur/steps);
}


function renderSplashSemana(){
  if(!turnosData||!turnosData.length)return;
  const DIAS=['Lun','Mar','Mié','Jue','Vie'];
  const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const hoy=new Date();
  const dow=hoy.getDay();
  const lunes=new Date(hoy);
  lunes.setDate(hoy.getDate()-(dow===0?6:dow-1));
  const viernes=new Date(lunes);viernes.setDate(lunes.getDate()+4);
  document.getElementById('s-semana-rango').textContent=
    lunes.getDate()+' '+MESES[lunes.getMonth()]+' – '+viernes.getDate()+' '+MESES[viernes.getMonth()];
  let html='';
  DIAS.forEach((dia,i)=>{
    const fecha=new Date(lunes);fecha.setDate(lunes.getDate()+i);
    const esHoy=fecha.toDateString()===hoy.toDateString();
    const fechaStr=fecha.toISOString().slice(0,10);
    const turnos=turnosData.filter(t=>t.fecha===fechaStr);
    const conteo={};
    turnos.forEach(t=>{
      const c=t.codigo;
      if(c==='1'||c==='2'||c==='4')conteo[c]=(conteo[c]||0)+1;
      else if(c==='V'||c==='VP')conteo['V']=(conteo['V']||0)+1;
      else if(c==='D')conteo['D']=(conteo['D']||0)+1;
      else if(c==='S'||c==='P'||c==='I'||c==='C')conteo['S']=(conteo['S']||0)+1;
    });
    html+='<div class="s-dia'+(esHoy?' hoy':'')+'">';
    html+='<div class="s-dia-nombre">'+dia+'</div>';
    html+='<div class="s-dia-num">'+fecha.getDate()+'</div>';
    html+='<div class="s-turno-pile">';
    ['1','2','4','V','D','S'].forEach(t=>{
      if(!conteo[t])return;
      const cls=t==='1'?'t1':t==='2'?'t2':t==='4'?'t4':t==='V'?'tv':t==='D'?'td':'ts';
      const lbl=t==='V'?'VAC':t==='D'?'DES':t==='S'?'PER':'T'+t;
      html+='<div class="s-chip '+cls+'">'+lbl+' ×'+conteo[t]+'</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('s-semana-grid').innerHTML=html;
  document.getElementById('splash-semana').style.display='';
}

function switchMain(tab,btn){
  activeMainTab=tab;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='cursos')renderCursos();
  if(tab==='equipo')renderEquipo();
  if(tab==='cumple')renderCumple();
  if(tab==='recon')renderRecon();
}

function switchSub(page,tab,btn){
  btn.closest('.sub-tabs').querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(page==='cursos'){activeCursoTab=tab;openGroups={};renderCursos();}
  if(page==='equipo'){
    activeEquipoTab=tab;
    document.getElementById('search-wrap-equipo').style.display=(tab==='responsables'||tab==='vista'||tab==='antiguedad')?'none':'';
    openEmps={};renderEquipo();
  }
}

function parseDate(s){
  if(!s)return null;
  if(s.includes('/')){const[m,d,y]=s.split('/');return new Date(+y,+m-1,+d);}
  const[y,m,d]=s.split('-');return new Date(+y,+m-1,+d);
}
function fmtDate(s){const d=parseDate(s);if(!d)return s||'—';return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});}
function fmtTime(t){if(!t)return'—';const[h,m]=t.split(':');let hh=parseInt(h);const ap=hh>=12?'PM':'AM';hh=hh%12||12;return`${hh}:${m||'00'} ${ap}`;}
function endTime(hora,dur){if(!hora||!dur)return null;const[h,m]=hora.split(':').map(Number);const tot=h*60+m+Math.round(parseFloat(dur)*60);const eh=Math.floor(tot/60)%24,em=tot%60;return`${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}:00`;}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getWeekDates(){
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

function buildWeekStrip(empId){
  const days=getWeekDates();
  const today=new Date();today.setHours(0,0,0,0);
  const DAY_NAMES=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let html='<div class="week-box"><div class="wl">Esta semana</div><div class="wdays">';
  days.forEach((d,i)=>{
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const turno=turnosData.find(t=>t.empleado_id===empId&&t.fecha===iso);
    const code=turno?turno.codigo:(i>=5?'off':'—');
    const cls=turno?`dc-${esc(turno.codigo)}`:'dc-off';
    const todayCls=d.getTime()===today.getTime()?' dc-today':'';
    html+=`<div class="wd"><div class="wdn">${DAY_NAMES[i]}</div><div class="wdc ${cls}${todayCls}">${esc(code)}</div></div>`;
  });
  html+='</div></div>';return html;
}

function buildNextCourse(nombre){
  const today=new Date();today.setHours(0,0,0,0);
  const next=cursosData.filter(r=>{
    if((r.status||'pendiente')==='completado')return false;
    if((r.usuario||'').toLowerCase()!==nombre.toLowerCase())return false;
    const d=parseDate(r.fecha_inicio);return d&&d>=today;
  }).sort((a,b)=>parseDate(a.fecha_inicio)-parseDate(b.fecha_inicio))[0];
  if(!next)return'';
  const fin=endTime(next.hora_inicio,next.duracion);
  return`<div class="nc-box"><div class="ncl">Próximo curso</div><div class="nct">${esc(next.nombre_curso||'—')}</div><div class="ncm">${fmtDate(next.fecha_inicio)} · ${fmtTime(next.hora_inicio)}${fin?' – '+fmtTime(fin):''} · ${esc(next.modalidad||'—')}</div></div>`;
}

function renderCursosByFecha(data,container){

function scheduleReveal(){
  requestAnimationFrame(()=>{
    const els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){els.forEach(el=>el.classList.add('visible'));return;}
    const obs=new IntersectionObserver((entries)=>{entries.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*30);obs.unobserve(e.target);}});},{threshold:.05});
    els.forEach(el=>obs.observe(el));
  });
}

  else if(e.key==='Backspace')pinDel();
  else if(e.key==='Escape')closePin();
}
function pinKey(k){
  if(pinBuffer.length>=4)return;
  if(Date.now()<pinBlockUntil){showPinBlockMsg('pin-error',pinBlockUntil);return;}
  pinBuffer+=k;document.getElementById('pd'+(pinBuffer.length-1)).classList.add('filled');
  if(pinBuffer.length===4){
    setTimeout(async()=>{
      const ok=await verifyPin(pinBuffer);
      if(ok){pinAttempts=0;closePin();editMode=true;renderVistaGeneral();}
      else{
        pinAttempts++;
        pinBuffer='';for(let i=0;i<4;i++)document.getElementById('pd'+i).classList.remove('filled');
        if(pinAttempts>=PIN_MAX){pinBlockUntil=Date.now()+PIN_BLOCK_MS;pinAttempts=0;showPinBlockMsg('pin-error',pinBlockUntil);}
        else{document.getElementById('pin-error').textContent='PIN incorrecto — '+(PIN_MAX-pinAttempts)+' intento'+(PIN_MAX-pinAttempts===1?'':'s')+' restante'+(PIN_MAX-pinAttempts===1?'':'s');}
      }
    },200);
  }
}
function pinDel(){if(!pinBuffer.length)return;document.getElementById('pd'+(pinBuffer.length-1)).classList.remove('filled');pinBuffer=pinBuffer.slice(0,-1);const err=document.getElementById('pin-error');if(err)err.textContent='';}
function closePin(){const el=document.getElementById('pin-overlay');if(el)el.remove();pinBuffer='';document.removeEventListener('keydown',_pinKH);}


function showPinBlockMsg(elId,until){
  const left=Math.max(0,Math.ceil((until-Date.now())/1000));
  const m=Math.floor(left/60);const s=left%60;
  const el=document.getElementById(elId);
  if(el)el.textContent='Bloqueado '+m+':'+(s<10?'0':'')+s+' min por intentos fallidos';
}

async function selectCode(code){

}

async function clearCode(){
  closeCodePicker();if(!pendingCell)return;

  const idx=turnosData.findIndex(t=>t.empleado_id===empId&&t.fecha===fecha);

async function saveCurso(id){
  const data={
    nombre_curso:document.getElementById('cs-nombre').value.trim(),
    usuario:document.getElementById('cs-usuario').value,
    fecha_inicio:document.getElementById('cs-finicio').value,
    fecha_final:document.getElementById('cs-ffinal').value||document.getElementById('cs-finicio').value,
    hora_inicio:document.getElementById('cs-hora').value,
    duracion:parseFloat(document.getElementById('cs-dur').value)||null,
    modalidad:document.getElementById('cs-modalidad').value,
    ubicacion:document.getElementById('cs-ubi').value.trim(),
  };
  if(!data.nombre_curso||!data.usuario){alert('Nombre y agente son requeridos');return;}
  closeCursoSheet();
  try{
    if(id){
      await fetch(`${SB_URL}/rest/v1/Cursos?id=eq.${id}`,{method:'PATCH',headers:{...HEADERS,Prefer:'return=minimal'},body:JSON.stringify(data)});
      const idx=cursosData.findIndex(c=>c.id===id);
      if(idx>=0)cursosData[idx]={...cursosData[idx],...data};
    }else{
      const res=await fetch(`${SB_URL}/rest/v1/Cursos`,{method:'POST',headers:{...HEADERS,Prefer:'return=representation'},body:JSON.stringify(data)});
      const newC=await res.json();
      if(Array.isArray(newC)&&newC[0])cursosData.push(newC[0]);
      else cursosData.push({...data,id:Date.now(),status:'pendiente'});
    }
    renderCursos();
  }catch(e){console.error('[Portal] Save curso:',e);setSyncState('err','Error al guardar');}
}

async function toggleCompletado(id,isComp){
  const newStatus=isComp?'pendiente':'completado';
  try{
    await fetch(`${SB_URL}/rest/v1/Cursos?id=eq.${id}`,{method:'PATCH',headers:{...HEADERS,Prefer:'return=minimal'},body:JSON.stringify({status:newStatus})});
    const idx=cursosData.findIndex(c=>c.id===id);
    if(idx>=0)cursosData[idx].status=newStatus;
    renderCursos();
  }catch(e){console.error('[Portal] Toggle completado:',e);}
}

async function deleteCurso(id){
  if(!confirm('¿Eliminar este curso? Esta acción no se puede deshacer.'))return;
  try{
    await fetch(`${SB_URL}/rest/v1/Cursos?id=eq.${id}`,{method:'DELETE',headers:HEADERS});
    cursosData=cursosData.filter(c=>c.id!==id);
    renderCursos();
  }catch(e){console.error('[Portal] Delete curso:',e);}
}

const MONTHS_BDAY=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function getBdayData(){
  return empleadosData.filter(e=>e.fecha_nacimiento).map(e=>{
    const d=new Date(e.fecha_nacimiento+'T12:00:00');
    const extra=BDAY_APODOS[e.nombre]||{};
    const nombre=extra.apodo||e.nombre;
    const inits=nombre.split(' ').map(w=>w[0]).slice(0,3).join('').toUpperCase();
    const area=e.seccion==='650'?'CL650':e.seccion==='3500'?'CL3500':e.seccion||'--';
    return{name:nombre,initials:inits,birth:{m:d.getMonth(),d:d.getDate()},area,seniority:extra.seniority||0,hire:extra.hire||'--',cake:e.pastel_favorito||'--'};
  });
}
function bdayIsToday(m,d){const n=new Date();return m===n.getMonth()&&d===n.getDate();}
function bdayIsPast(m,d){const n=new Date();return m<n.getMonth()||(m===n.getMonth()&&d<n.getDate());}
function bdayDaysUntil(m,d){const n=new Date();const nx=new Date(n.getFullYear(),m,d);if(nx<n)nx.setFullYear(n.getFullYear()+1);return Math.round((nx-n)/86400000);}
function bdayAvCls(area){return area==='CL650'?'cl650':area==='SBU'?'sbu':'';}

function renderCumple(){
  const content=document.getElementById('content-cumple');
  const now=new Date();const tm=now.getMonth();
  const DATA=getBdayData();
  if(!DATA.length){content.innerHTML='<div class="state-msg"><span class="icon">&#9203;</span>Cargando...</div>';return;}
  const sorted=[...DATA].sort((a,b)=>a.birth.m!==b.birth.m?a.birth.m-b.birth.m:a.birth.d-b.birth.d);
  const enMes=sorted.filter(p=>p.birth.m===tm).length;
  const prox=sorted.filter(p=>!bdayIsToday(p.birth.m,p.birth.d)&&!bdayIsPast(p.birth.m,p.birth.d)&&bdayDaysUntil(p.birth.m,p.birth.d)<=30).length;
  const pas=sorted.filter(p=>bdayIsPast(p.birth.m,p.birth.d)).length;
  let html='<div class="stats-strip">'
    +'<div class="stat-box-sm"><div class="sn yt">'+enMes+'</div><div class="sl">Este mes</div></div>'
    +'<div class="stat-box-sm"><div class="sn gr">'+prox+'</div><div class="sl">Prox. 30 dias</div></div>'
    +'<div class="stat-box-sm"><div class="sn">'+pas+'</div><div class="sl">Ya pasaron</div></div>'
    +'<div class="stat-box-sm"><div class="sn">'+DATA.length+'</div><div class="sl">Total equipo</div></div>'
    +'</div>';
  const byMonth={};
  sorted.forEach(p=>{if(!byMonth[p.birth.m])byMonth[p.birth.m]=[];byMonth[p.birth.m].push(p);});
  for(let m=0;m<12;m++){
    if(!byMonth[m])continue;
    const isCur=m===tm;
    html+='<div class="section-heading'+(isCur?' current':'')+'">'+MONTHS_BDAY[m]+(isCur?' - hoy':'')+'</div>';
    byMonth[m].forEach(function(p){
      const today=bdayIsToday(p.birth.m,p.birth.d);
      const past=bdayIsPast(p.birth.m,p.birth.d);
      const days=bdayDaysUntil(p.birth.m,p.birth.d);
      const rowCls=today?'today':past?'past':'';
      const avCls=today?'bday-hoy':bdayAvCls(p.area);
      const badge=today?'<span class="badge badge-hoy">&#127874; Hoy!</span>'
        :past?'<span class="badge badge-pasado">Pasado</span>'
        :days<=30?'<span class="badge badge-pronto">'+days+' dias</span>'
        :'<span class="badge badge-pasado">'+days+' dias</span>';
      html+='<div class="bday-row '+rowCls+' reveal">'
        +'<div class="bday-av '+avCls+'">'+esc(p.initials)+'</div>'
        +'<div class="bday-info"><div class="bday-name">'+esc(p.name)+'</div>'
        +'<div class="bday-meta"><span>'+esc(p.area)+'</span>'
        +(p.cake&&p.cake!=='--'?'<span class="cake-tag">&#127874; '+esc(p.cake)+'</span>':'')
        +'</div></div>'
        +'<div class="bday-right"><div class="bday-date">'+p.birth.d+' '+MONTHS_BDAY[p.birth.m].slice(0,3).toLowerCase()+'</div>'+badge+'</div>'
        +'</div>';
    });
  }
  content.innerHTML=html;scheduleReveal();
}

function getrank(s){
  if(s<2)return{key:'nuevo',label:'Nuevo',cls:'nuevo',barCls:'fill-nuevo',max:2};
  if(s<5)return{key:'consol',label:'Consolidado',cls:'consol',barCls:'fill-consol',max:5};
  if(s<10)return{key:'senior',label:'Senior',cls:'senior',barCls:'fill-senior',max:10};
  return{key:'veteran',label:'Veterano',cls:'veteran',barCls:'fill-veteran',max:20};
}
function getrank_key(s){return s<2?'nuevo':s<5?'consol':s<10?'senior':'veteran';}

  const counts={nuevo:0,consol:0,senior:0,veteran:0};
  sorted.forEach(p=>counts[getrank_key(p.seniority)]++);
  let html='<div class="stats-strip">'
    +'<div class="stat-box-sm"><div class="sn gr">'+counts.nuevo+'</div><div class="sl">Nuevos</div></div>'
    +'<div class="stat-box-sm"><div class="sn yt">'+counts.consol+'</div><div class="sl">Consolidados</div></div>'
    +'<div class="stat-box-sm"><div class="sn bl">'+counts.senior+'</div><div class="sl">Seniors</div></div>'
    +'<div class="stat-box-sm"><div class="sn pk">'+counts.veteran+'</div><div class="sl">Veteranos</div></div>'
    +'</div>'
    +'<div class="ant-legend">'
    +'<div class="ant-legend-item"><span class="ant-legend-dot" style="background:var(--green)"></span>Nuevo 0-2 anos</div>'
    +'<div class="ant-legend-item"><span class="ant-legend-dot" style="background:var(--yellow)"></span>Consolidado 2-5 anos</div>'
    +'<div class="ant-legend-item"><span class="ant-legend-dot" style="background:var(--blue)"></span>Senior 5-10 anos</div>'
    +'<div class="ant-legend-item"><span class="ant-legend-dot" style="background:var(--pink)"></span>Veterano 10+ anos</div>'
    +'</div>';
  let prevKey=null;
  sorted.forEach(function(p){
    const r=getrank(p.seniority);
    if(r.key!==prevKey){html+='<div class="section-heading">'+r.label+'</div>';prevKey=r.key;}
    const pct=Math.min(100,Math.round((p.seniority/r.max)*100));
    html+='<div class="ant-row reveal">'
      +'<div class="ant-top">'
      +'<div class="ant-av r-'+r.cls+'">'+esc(p.initials)+'</div>'
      +'<div class="ant-info"><div class="ant-name">'+esc(p.name)+'</div>'
      +'<div class="ant-sub">'+esc(p.area)+' - Desde '+esc(p.hire)+'</div></div>'
      +'<div class="ant-right"><div class="ant-years">'+p.seniority.toFixed(1)+'<small> anos</small></div>'
      +'<span class="rank-badge rank-'+r.cls+'">'+r.label+'</span></div>'
      +'</div>'
      +'<div class="ant-bar-wrap"><div class="ant-bar-fill '+r.barCls+'" style="width:'+pct+'%"></div></div>'
      +'</div>';
  });
  container.innerHTML=html;scheduleReveal();
}

let reconData=[];
let reconLoaded=false;
let reconSubTab='feed';

function switchSubRecon(tab,btn){
  reconSubTab=tab;
  document.querySelectorAll('#subtabs-recon .stab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('content-recon-feed').style.display=tab==='feed'?'':'none';
  document.getElementById('content-recon-ranking').style.display=tab==='ranking'?'':'none';
  if(tab==='ranking')renderReconRanking();
}

async function loadRecon(){
  try{
    const res=await fetch(SB_URL+'/rest/v1/Reconocimientos?select=*,Empleados(nombre,seccion)&order=fecha.desc',{headers:HEADERS});
    reconData=await res.json();
    reconLoaded=true;
  }catch(e){console.warn('Recon:',e);reconLoaded=true;}
}

function recAvCls(seccion){
  return seccion==='650'?'cl650':seccion==='SBU'?'sbu':'';
}

function recCatCls(cat){
  const m={'Trabajo en equipo':'equipo','Actitud':'actitud','Iniciativa':'iniciativa','Puntualidad':'puntualidad','Calidad':'calidad','Apoyo':'apoyo'};
  return 'cat-'+(m[cat]||'equipo');
}

function recInits(nombre){
  return (nombre||'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function recFecha(iso){
  const d=new Date(iso);
  const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate()+' '+MESES[d.getMonth()];
}

function recMesLabel(iso){
  const d=new Date(iso);
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return MESES[d.getMonth()]+' '+d.getFullYear();
}

function renderRecon(){
  renderReconFeed();
}

function renderReconFeed(){
  const content=document.getElementById('content-recon-feed');
  if(!reconLoaded){content.innerHTML='<div class="state-msg"><span class="icon">&#9203;</span>Cargando...</div>';loadRecon().then(()=>renderReconFeed());return;}
  const now=new Date();
  const esteMes=reconData.filter(r=>{const d=new Date(r.fecha);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
  let html='<div class="rec-stats">'
    +'<div class="stat-box-sm"><div class="sn yt">'+esteMes+'</div><div class="sl">Este mes</div></div>'
    +'<div class="stat-box-sm"><div class="sn">'+reconData.length+'</div><div class="sl">Total hist\u00f3rico</div></div>'
    +'</div>';
  html+='<button class="rec-btn-nuevo" onclick="toggleRecForm()">+ Dar reconocimiento</button>';
  html+='<div id="rec-form-wrap" style="display:none">'
    +'<div class="rec-form">'
    +'<div class="rec-form-row">'
    +'<div><label class="field-label">Para qui\u00e9n</label>'
    +'<select id="rec-para">'
    +'<option value="">Seleccionar...</option>'
    +empleadosData.map(e=>'<option value="'+e.id+'">'+esc(e.nombre)+'</option>').join('')
    +'</select></div>'
    +'<div><label class="field-label">De parte de</label>'
    +'<input type="text" id="rec-de" placeholder="Tu nombre"></div>'
    +'</div>'
    +'<div style="margin-bottom:10px"><label class="field-label">Categor\u00eda</label>'
    +'<select id="rec-cat">'
    +'<option value="">Seleccionar...</option>'
    +'<option>Trabajo en equipo</option>'
    +'<option>Actitud</option>'
    +'<option>Iniciativa</option>'
    +'<option>Puntualidad</option>'
    +'<option>Calidad</option>'
    +'<option>Apoyo</option>'
    +'</select></div>'
    +'<div><label class="field-label">Mensaje</label>'
    +'<textarea id="rec-msg" rows="3" placeholder="\u00bfQu\u00e9 hizo que lo hace merecedor de este reconocimiento?"></textarea></div>'
    +'<div class="rec-form-actions">'
    +'<button class="rec-cancel" onclick="toggleRecForm()">Cancelar</button>'
    +'<button class="rec-submit" onclick="saveRecon()">Enviar reconocimiento</button>'
    +'</div>'
    +'<div id="rec-error" style="font-size:11px;color:var(--pink);margin-top:6px;"></div>'
    +'</div></div>';
  const byMonth={};
  reconData.forEach(r=>{const k=recMesLabel(r.fecha);if(!byMonth[k])byMonth[k]=[];byMonth[k].push(r);});
  Object.entries(byMonth).forEach(([mes,items])=>{
    html+='<div class="section-heading">'+esc(mes)+'</div>';
    items.forEach(r=>{
      const emp=r.Empleados||{};
      const cls=recAvCls(emp.seccion);
      html+='<div class="rec-card reveal">'
        +'<div class="rec-top">'
        +'<div class="rec-av-wrap '+cls+'">'+esc(recInits(emp.nombre))+'</div>'
        +'<div class="rec-info"><div class="rec-name">'+esc(emp.nombre||'--')+'</div>'
        +'<div class="rec-from">De: '+esc(r.de_nombre)+'</div></div>'
        +'<div class="rec-right"><div class="rec-date-lbl">'+recFecha(r.fecha)+'</div>'
        +'<span class="cat-badge '+recCatCls(r.categoria)+'">'+esc(r.categoria)+'</span>'
        +'<button class="rec-delete" onclick="deleteRecon('+r.id+')">&#128465; Eliminar</button>'
        +'</div></div>'
        +(r.mensaje?'<div class="rec-msg">'+esc(r.mensaje)+'</div>':'')
        +'</div>';
    });
  });
  content.innerHTML=html;scheduleReveal();
}

function toggleRecForm(){
  const f=document.getElementById('rec-form-wrap');
  if(f)f.style.display=f.style.display==='none'?'block':'none';
}


async function deleteRecon(id){
  if(!confirm('\u00bfEliminar este reconocimiento?'))return;
  try{
    const res=await fetch(SB_URL+'/rest/v1/Reconocimientos?id=eq.'+id,{
      method:'DELETE',
      headers:HEADERS
    });
    if(res.ok){
      reconData=reconData.filter(r=>r.id!==id);
      renderReconFeed();
    }
  }catch(e){console.error('deleteRecon:',e);}
}

async function saveRecon(){
  const para=document.getElementById('rec-para').value;
  const de=document.getElementById('rec-de').value.trim();
  const cat=document.getElementById('rec-cat').value;
  const msg=document.getElementById('rec-msg').value.trim();
  const err=document.getElementById('rec-error');
  if(!para||!de||!cat){err.textContent='Completa los campos obligatorios.';return;}
  err.textContent='';
  try{
    const res=await fetch(SB_URL+'/rest/v1/Reconocimientos',{
      method:'POST',
      headers:{...HEADERS,'Prefer':'return=representation'},
      body:JSON.stringify({para_id:parseInt(para),de_nombre:de,categoria:cat,mensaje:msg||null})
    });
    if(!res.ok){const e=await res.json();err.textContent='Error: '+(e.message||'intenta de nuevo');return;}
    await loadRecon();
    renderReconFeed();
  }catch(e){err.textContent='Error de conexion, intenta de nuevo.';}
}

function renderReconRanking(){
  const content=document.getElementById('content-recon-ranking');
  if(!reconData.length){content.innerHTML='<div class="state-msg">Sin reconocimientos este mes.</div>';return;}
  const now=new Date();
  const esteMes=reconData.filter(r=>{const d=new Date(r.fecha);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const conteo={};
  esteMes.forEach(r=>{
    const emp=r.Empleados||{};
    if(!emp.nombre)return;
    if(!conteo[r.para_id])conteo[r.para_id]={nombre:emp.nombre,seccion:emp.seccion,count:0,cats:[]};
    conteo[r.para_id].count++;
    if(!conteo[r.para_id].cats.includes(r.categoria))conteo[r.para_id].cats.push(r.categoria);
  });
  const sorted=Object.values(conteo).sort((a,b)=>b.count-a.count);
  const max=sorted[0]?sorted[0].count:1;
  const mesLabel=MESES[now.getMonth()]+' '+now.getFullYear();
  let html='<div class="section-heading">'+mesLabel+' \u2014 m\u00e1s reconocidos</div>';
  if(!sorted.length){html+='<div class="state-msg">Sin reconocimientos este mes.</div>';content.innerHTML=html;return;}
  sorted.forEach((p,i)=>{
    const cls=recAvCls(p.seccion);
    const pct=Math.round((p.count/max)*100);
    const isTop=i<2;
    html+='<div class="rank-row">'
      +'<div class="rank-num'+(isTop?' top':'')+'>'+(i+1)+'</div>'
      +'<div class="rank-av rec-av-wrap '+cls+'" style="width:30px;height:30px;font-size:9px;">'+esc(recInits(p.nombre))+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:13px;font-weight:600;color:var(--text);">'+esc(p.nombre)+'</div>'
      +'<div style="font-size:11px;color:var(--text3);">'+p.cats.map(c=>esc(c)).join(' \u00b7 ')+'</div>'
      +'</div>'
      +'<div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="rank-count">'+p.count+'</div>'
      +'</div>';
  });
  content.innerHTML=html;
}

</script>
