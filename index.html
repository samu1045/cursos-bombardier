<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos · Quality PU1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #F5C400;
    --yellow-dim: rgba(245,196,0,0.12);
    --black: #0a0a0a;
    --gray-900: #141414;
    --gray-800: #1e1e1e;
    --gray-700: #2a2a2a;
    --gray-600: #3a3a3a;
    --gray-500: #5a5a5a;
    --gray-400: #7a7a7a;
    --gray-300: #aaaaaa;
    --gray-100: #d8d8d8;
    --white: #f5f5f5;
    --radius: 10px;
    --radius-sm: 7px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─────────────────── SPLASH ─────────────────── */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    overflow: hidden;
  }
  #splash::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(245,196,0,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Staggered fade-up items */
  .s-item {
    opacity: 0;
    transform: translateY(28px);
    animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .s-item:nth-child(1) { animation-delay: 0.1s; }
  .s-item:nth-child(2) { animation-delay: 0.25s; }
  .s-item:nth-child(3) { animation-delay: 0.38s; }
  .s-item:nth-child(4) { animation-delay: 0.50s; }
  .s-item:nth-child(5) { animation-delay: 0.62s; }
  .s-item:nth-child(6) { animation-delay: 0.76s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Splash hide transition */
  #splash.hide {
    animation: splashOut 0.55s cubic-bezier(0.4, 0, 1, 1) forwards;
    pointer-events: none;
  }
  @keyframes splashOut {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-18px); }
  }

  .s-badge {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--yellow);
    border: 1px solid rgba(245,196,0,0.35);
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 28px;
  }

  .s-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 800;
    color: var(--white);
    letter-spacing: -0.03em;
    line-height: 1.05;
    text-align: center;
    margin-bottom: 10px;
  }
  .s-title span { color: var(--yellow); }

  .s-sub {
    font-size: 13px;
    font-weight: 300;
    color: var(--gray-400);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .s-divider {
    width: 36px;
    height: 2px;
    background: var(--yellow);
    border-radius: 2px;
    margin-bottom: 40px;
  }

  .s-stats {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
  }
  .s-stat {
    text-align: center;
  }
  .s-stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    display: block;
    counter-reset: none;
  }
  .s-stat-num .counter {
    display: inline-block;
    animation: countUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .s-stat-label {
    font-size: 10px;
    color: var(--gray-500);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .s-enter {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--black);
    background: var(--yellow);
    border: none;
    padding: 13px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .s-enter:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(245,196,0,0.28);
  }
  .s-enter:active { transform: translateY(0); }

  /* ─────────────────── APP ─────────────────── */
  #app {
    display: none;
    opacity: 0;
    animation: appIn 0.5s ease forwards;
  }
  @keyframes appIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--gray-800);
    padding: 0 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 10px;
  }

  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-badge {
    width: 32px; height: 32px;
    background: var(--yellow);
    color: var(--black);
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 12px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
  }
  .logo-sub { font-size: 10px; color: var(--gray-500); letter-spacing: 0.06em; }

  .sync-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--gray-400);
    letter-spacing: 0.06em;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gray-600);
    flex-shrink: 0;
    transition: background 0.4s;
  }
  .dot.live { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.6); }
  .dot.err  { background: #f87171; }

  .tabs {
    display: flex;
    gap: 2px;
    padding-bottom: 0;
  }
  .tab {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--gray-500);
    padding: 9px 14px 11px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--gray-300); }
  .tab.active {
    color: var(--yellow);
    border-bottom-color: var(--yellow);
  }

  .search-wrap {
    padding: 10px 0 14px;
  }
  .search-input {
    width: 100%;
    background: var(--gray-900);
    border: 1px solid var(--gray-700);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: var(--gray-500); }
  .search-input:focus { border-color: var(--gray-500); }

  /* ─────────────────── CONTENT ─────────────────── */
  .content {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* State messages */
  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
    font-size: 13px;
  }
  .state-msg .icon { font-size: 28px; display: block; margin-bottom: 12px; }

  /* ─────────────────── GROUPS ─────────────────── */
  .group-card {
    margin-bottom: 10px;
    border: 1px solid var(--gray-800);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--gray-900);
  }

  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    gap: 10px;
  }
  .group-header:hover { background: var(--gray-800); }

  .group-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .group-avatar {
    width: 28px; height: 28px;
    background: var(--yellow-dim);
    border: 1px solid rgba(245,196,0,0.2);
    color: var(--yellow);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 10px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }

  .group-name {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-meta {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }

  .group-count {
    font-size: 10px;
    color: var(--gray-400);
    background: var(--gray-800);
    border-radius: 20px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .chevron {
    color: var(--gray-600);
    font-size: 12px;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1);
    flex-shrink: 0;
  }
  .group-card.open .chevron { transform: rotate(180deg); }

  /* Collapsible body */
  .group-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .group-card.open .group-body { max-height: 2000px; }

  .group-body-inner {
    border-top: 1px solid var(--gray-800);
    padding: 4px 0;
  }

  /* ─────────────────── ROWS ─────────────────── */
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--gray-800);
    transition: background 0.12s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255,255,255,0.02); }

  .row-main {}
  .row-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--white);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .row-sub {
    font-size: 11px;
    color: var(--gray-400);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .row-sub-dot {
    width: 2px; height: 2px;
    background: var(--gray-600);
    border-radius: 50%;
  }

  .row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .badge {
    font-size: 10px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .badge-virtual { background: rgba(99,179,237,0.15); color: #63b3ed; }
  .badge-presencial { background: rgba(74,222,128,0.12); color: #4ade80; }
  .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
  .badge-gray { background: var(--gray-800); color: var(--gray-400); }

  .time-text {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    white-space: nowrap;
  }

  /* ─────────────────── EQUIPO ─────────────────── */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    padding-top: 4px;
  }

  .person-card {
    background: var(--gray-900);
    border: 1px solid var(--gray-800);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.2s;
  }
  .person-card:hover { border-color: var(--gray-600); }

  .person-top { display: flex; align-items: center; gap: 12px; }
  .person-avatar {
    width: 40px; height: 40px;
    background: var(--yellow-dim);
    border: 1px solid rgba(245,196,0,0.25);
    color: var(--yellow);
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .person-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
  }
  .person-role { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

  .person-links { display: flex; gap: 8px; }
  .plink {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid var(--gray-800);
    background: var(--gray-800);
    color: var(--gray-300);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .plink:hover { background: var(--gray-700); border-color: var(--gray-600); color: var(--white); }
  .plink svg { flex-shrink: 0; }
  .plink.wa { color: #4ade80; }
  .plink.wa:hover { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.3); }
  .plink.em { color: #63b3ed; }
  .plink.em:hover { background: rgba(99,179,237,0.12); border-color: rgba(99,179,237,0.3); }

  /* Section heading (Por Fecha months) */
  .section-heading {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray-500);
    margin: 20px 0 8px;
  }
  .section-heading:first-child { margin-top: 0; }

  /* Scroll-reveal for rows */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

</style>
</head>
<body>

<!-- ═══════════════ SPLASH ═══════════════ -->
<div id="splash">
  <div class="s-item s-badge">Quality PU1 · Bombardier</div>
  <div class="s-item s-title">Calendario de<br><span>Capacitación</span></div>
  <div class="s-item s-sub">Querétaro · 2026</div>
  <div class="s-item s-divider"></div>
  <div class="s-item s-stats">
    <div class="s-stat">
      <span class="s-stat-num" id="stat-agentes">—</span>
      <span class="s-stat-label">Agentes</span>
    </div>
    <div class="s-stat">
      <span class="s-stat-num" id="stat-cursos">—</span>
      <span class="s-stat-label">Cursos</span>
    </div>
    <div class="s-stat">
      <span class="s-stat-num" id="stat-horas">—</span>
      <span class="s-stat-label">Horas</span>
    </div>
  </div>
  <div class="s-item">
    <button class="s-enter" onclick="enterApp()">Ver Cursos →</button>
  </div>
</div>

<!-- ═══════════════ APP ═══════════════ -->
<div id="app">
  <header>
    <div class="header-top">
      <div class="logo-area">
        <div class="logo-badge">QU</div>
        <div>
          <div class="logo-title">Cursos · Quality PU1</div>
          <div class="logo-sub">Bombardier</div>
        </div>
      </div>
      <div class="sync-badge">
        <span class="dot" id="dot"></span>
        <span id="sync-text">cargando…</span>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" onclick="switchTab('agente', this)" role="tab">Por Agente</button>
      <button class="tab" onclick="switchTab('curso', this)" role="tab">Por Curso</button>
      <button class="tab" onclick="switchTab('fecha', this)" role="tab">Por Fecha</button>
      <button class="tab" onclick="switchTab('equipo', this)" role="tab">Equipo</button>
    </div>
    <div class="search-wrap" id="search-wrap">
      <input class="search-input" type="text" id="search" placeholder="Buscar…" oninput="renderView()">
    </div>
  </header>
  <div class="content" id="content">
    <div class="state-msg"><span class="icon">⏳</span>Cargando datos…</div>
  </div>
</div>

<script>
// ─────── CONFIG ───────
const SUPABASE_URL  = 'https://andtyljudrsymincblaf.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuZHR5bGp1ZHJzeW1pbmNibGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg4NjQ5NTIsImV4cCI6MjA2NDQ0MDk1Mn0.I5LcMh1ODQjz8xrW1PQCzuBcVBJVGNwexH8jnHVH1R4';
const TABLE        = 'Cursos';

const TEAM = [
  {
    name: 'Samuel Mejia',
    role: 'Quality PU1',
    initials: 'SM',
    wa: '524424512999',
    email: 'samuel.mejia@bombardier.com'
  },
  {
    name: 'Omar Balderas',
    role: 'Quality PU1',
    initials: 'OB',
    wa: '524427226388',
    email: 'omar.balderas@bombardier.com'
  }
];

const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ─────── STATE ───────
let allData   = [];
let activeTab = 'agente';
let openGroups = {};

// ─────── FETCH ───────
async function loadData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=fecha_inicio.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    if (!res.ok) throw new Error(res.status);
    allData = await res.json();

    // Populate splash stats
    const agentes = new Set(allData.map(r => r.usuario)).size;
    const cursos  = new Set(allData.map(r => r.nombre_curso)).size;
    const horas   = allData.reduce((s, r) => s + (parseFloat(r.duracion) || 0), 0);
    animCount('stat-agentes', agentes);
    animCount('stat-cursos',  cursos);
    animCount('stat-horas',   Math.round(horas));

    setSyncState('live', 'En vivo');
    renderView();
  } catch(e) {
    setSyncState('err', 'Error');
    document.getElementById('content').innerHTML =
      '<div class="state-msg"><span class="icon">⚠️</span>No se pudo conectar a Supabase.</div>';
  }
}

function setSyncState(state, text) {
  const dot  = document.getElementById('dot');
  const span = document.getElementById('sync-text');
  dot.className  = 'dot ' + state;
  span.textContent = text;
}

function animCount(id, target) {
  const el = document.getElementById(id);
  if (!el) return;
  const dur = 900, steps = 30;
  let i = 0;
  const iv = setInterval(() => {
    i++;
    el.textContent = Math.round(target * (i / steps));
    if (i >= steps) { el.textContent = target; clearInterval(iv); }
  }, dur / steps);
}

// ─────── PARSE DATE ───────
function parseDate(str) {
  if (!str) return null;
  // Handle M/D/YYYY or MM/DD/YYYY
  if (str.includes('/')) {
    const [m, d, y] = str.split('/');
    return new Date(+y, +m - 1, +d);
  }
  // YYYY-MM-DD
  const [y, m, d] = str.split('-');
  return new Date(+y, +m - 1, +d);
}

function fmtDate(str) {
  const d = parseDate(str);
  if (!d) return str || '—';
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
}

function fmtTime(t) {
  if (!t) return '—';
  const parts = t.split(':');
  let h = parseInt(parts[0]), m = parts[1] || '00';
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function endTime(hora, duracion) {
  if (!hora || !duracion) return null;
  const [h, m] = hora.split(':').map(Number);
  const totalMin = h * 60 + m + Math.round(parseFloat(duracion) * 60);
  const eh = Math.floor(totalMin / 60) % 24;
  const em = totalMin % 60;
  return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}:00`;
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}

// ─────── TABS ───────
function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const sw = document.getElementById('search-wrap');
  sw.style.display = tab === 'equipo' ? 'none' : '';
  document.getElementById('search').value = '';
  openGroups = {};
  renderView();
}

// ─────── RENDER ───────
function renderView() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();

  const filtered = allData.filter(r => {
    if (!q) return true;
    return (r.nombre_curso || '').toLowerCase().includes(q) ||
           (r.usuario      || '').toLowerCase().includes(q) ||
           (r.modalidad    || '').toLowerCase().includes(q) ||
           (r.ubicacion    || '').toLowerCase().includes(q);
  });

  const content = document.getElementById('content');

  if (activeTab === 'equipo') { renderEquipo(content); return; }

  if (!filtered.length) {
    content.innerHTML = '<div class="state-msg"><span class="icon">🔍</span>Sin resultados.</div>';
    return;
  }

  if (activeTab === 'agente') renderByKey('usuario',      filtered, content, r => r.usuario);
  if (activeTab === 'curso')  renderByKey('nombre_curso', filtered, content, r => r.nombre_curso);
  if (activeTab === 'fecha')  renderByFecha(filtered, content);
}

// Generic grouped view
function renderByKey(key, data, container, keyFn) {
  const groups = {};
  data.forEach(r => {
    const k = keyFn(r) || '(sin nombre)';
    if (!groups[k]) groups[k] = [];
    groups[k].push(r);
  });

  const keys = Object.keys(groups).sort();
  let html = '';
  keys.forEach(k => {
    const items = groups[k];
    const isOpen = openGroups[key + ':' + k];
    html += buildGroupCard(key + ':' + k, initials(k), k, items, isOpen);
  });
  container.innerHTML = html;
  attachGroupListeners();
  scheduleReveal();
}

// By fecha view (grouped by month)
function renderByFecha(data, container) {
  const months = {};
  data.forEach(r => {
    const d = parseDate(r.fecha_inicio);
    const mk = d ? `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}` : 'zzz';
    const ml = d ? MONTHS_ES[d.getMonth()] + ' ' + d.getFullYear() : 'Sin fecha';
    if (!months[mk]) months[mk] = { label: ml, courses: {} };
    const ck = r.nombre_curso || '(sin nombre)';
    if (!months[mk].courses[ck]) months[mk].courses[ck] = [];
    months[mk].courses[ck].push(r);
  });

  let html = '';
  Object.keys(months).sort().forEach(mk => {
    const { label, courses } = months[mk];
    html += `<div class="section-heading">${label}</div>`;
    Object.keys(courses).sort().forEach(ck => {
      const items = courses[ck];
      const gkey = `fecha:${mk}:${ck}`;
      const isOpen = openGroups[gkey];
      html += buildGroupCard(gkey, initials(ck), ck, items, isOpen, true);
    });
  });
  container.innerHTML = html;
  attachGroupListeners();
  scheduleReveal();
}

function buildGroupCard(gkey, av, name, items, isOpen, byFecha) {
  const openClass = isOpen ? ' open' : '';
  const countLabel = `${items.length} ${items.length === 1 ? 'curso' : byFecha ? 'agentes' : 'cursos'}`;
  let rowsHtml = '';

  items.forEach(r => {
    const fin  = endTime(r.hora_inicio, r.duracion);
    const mod  = (r.modalidad || '').toLowerCase();
    const modClass = mod.includes('virtual') ? 'badge-virtual' : mod.includes('presencial') ? 'badge-presencial' : 'badge-gray';
    const modLabel = r.modalidad || '—';

    const dateStr = r.fecha_inicio && r.fecha_final && r.fecha_inicio !== r.fecha_final
      ? `${fmtDate(r.fecha_inicio)} – ${fmtDate(r.fecha_final)}`
      : fmtDate(r.fecha_inicio);

    const sub2 = byFecha ? escHtml(r.usuario || '—') : dateStr;

    rowsHtml += `
      <div class="row">
        <div class="row-main">
          <div class="row-title">${escHtml(byFecha ? r.usuario : r.nombre_curso)}</div>
          <div class="row-sub">
            <span>${sub2}</span>
            ${r.ubicacion ? `<span class="row-sub-dot"></span><span>${escHtml(r.ubicacion)}</span>` : ''}
            ${r.week ? `<span class="row-sub-dot"></span><span>W${escHtml(String(r.week))}</span>` : ''}
          </div>
        </div>
        <div class="row-right">
          <span class="badge ${modClass}">${escHtml(modLabel)}</span>
          <span class="time-text">${fmtTime(r.hora_inicio)}${fin ? ' – ' + fmtTime(fin) : ''}</span>
        </div>
      </div>`;
  });

  return `
    <div class="group-card reveal${openClass}" data-gkey="${escHtml(gkey)}">
      <div class="group-header">
        <div class="group-left">
          <div class="group-avatar">${escHtml(av)}</div>
          <div class="group-name">${escHtml(name)}</div>
        </div>
        <div class="group-meta">
          <span class="group-count">${countLabel}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="group-body">
        <div class="group-body-inner">${rowsHtml}</div>
      </div>
    </div>`;
}

function attachGroupListeners() {
  document.querySelectorAll('.group-header').forEach(h => {
    h.addEventListener('click', () => {
      const card = h.closest('.group-card');
      const gkey = card.dataset.gkey;
      const isNowOpen = card.classList.toggle('open');
      openGroups[gkey] = isNowOpen;
    });
  });
}

// ─────── SCROLL REVEAL ───────
function scheduleReveal() {
  requestAnimationFrame(() => {
    const els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('visible'));
      return;
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), i * 35);
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.05 });
    els.forEach(el => obs.observe(el));
  });
}

// ─────── SPLASH ENTER ───────
function enterApp() {
  const splash = document.getElementById('splash');
  const app    = document.getElementById('app');
  splash.classList.add('hide');
  setTimeout(() => {
    splash.style.display = 'none';
    app.style.display    = 'block';
  }, 520);
}

// ─────── UTILS ───────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
